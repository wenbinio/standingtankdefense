name: sim-core CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: sim-core

jobs:
  determinism:
    name: build + test + determinism gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --locked
      - name: Test (incl. cross-platform golden checksum)
        run: cargo test --workspace --locked
      - name: M0 determinism gate
        run: cargo run --locked -p harness

  hygiene:
    name: fmt + clippy (sim-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  type-check:
    # `godot/rust` and `adapters/steam-transport` are separate Cargo trees
    # (GDExtension / Steam SDK link steps keep them out of the sim-core
    # workspace). `cargo check` type-checks both without the Steam SDK — the
    # SDK is only needed to LINK, not to check.
    name: cargo check (godot/rust + steam-transport)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: check godot/rust
        run: cargo check --locked
        working-directory: godot/rust
      - name: check adapters/steam-transport
        run: cargo check --locked
        working-directory: adapters/steam-transport
