<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- GRIMDARK player FX: CLEAR ability shockwave. Large powerful expanding ring in cold -->
  <!-- #5BC8E6 with soft glow, transparent center, epic. Radial, centered, no facing. -->
  <defs>
    <!-- ring body: bright cold crest -->
    <radialGradient id="c_ring" cx="50%" cy="50%" r="50%">
      <stop offset="78%"  stop-color="#5BC8E6" stop-opacity="0"/>
      <stop offset="88%"  stop-color="#5BC8E6"/>
      <stop offset="93%"  stop-color="#EAFBFF"/>
      <stop offset="97%"  stop-color="#5BC8E6"/>
      <stop offset="100%" stop-color="#5BC8E6" stop-opacity="0"/>
    </radialGradient>
    <!-- inner pressure tint, fading to transparent center -->
    <radialGradient id="c_fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#5BC8E6" stop-opacity="0"/>
      <stop offset="62%" stop-color="#5BC8E6" stop-opacity="0"/>
      <stop offset="85%" stop-color="#1E7C95" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5BC8E6" stop-opacity="0"/>
    </radialGradient>
    <filter id="c_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="c_glowsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- big soft cold glow behind the ring (emissive) -->
  <circle cx="64" cy="64" r="56" fill="url(#c_ring)" filter="url(#c_glow)" opacity="0.7"/>

  <!-- inner pressure tint -->
  <circle cx="64" cy="64" r="56" fill="url(#c_fill)"/>

  <!-- crisp bright expanding ring crest -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#5BC8E6" stroke-width="5" opacity="0.85" filter="url(#c_glowsoft)"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#EAFBFF" stroke-width="2"/>

  <!-- trailing secondary ripple (epic, expanding sense) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#5BC8E6" stroke-width="2.5" opacity="0.45" filter="url(#c_glowsoft)"/>

  <!-- faint leading shock spikes (radial energy lances) -->
  <g transform="translate(64 64)" opacity="0.6" filter="url(#c_glowsoft)">
    <path d="M-2 -50 L0 -60 L2 -50 Z" fill="#EAFBFF"/>
    <path d="M-2 -50 L0 -60 L2 -50 Z" fill="#EAFBFF" transform="rotate(60)"/>
    <path d="M-2 -50 L0 -60 L2 -50 Z" fill="#EAFBFF" transform="rotate(120)"/>
    <path d="M-2 -50 L0 -60 L2 -50 Z" fill="#EAFBFF" transform="rotate(180)"/>
    <path d="M-2 -50 L0 -60 L2 -50 Z" fill="#EAFBFF" transform="rotate(240)"/>
    <path d="M-2 -50 L0 -60 L2 -50 Z" fill="#EAFBFF" transform="rotate(300)"/>
  </g>
</svg>
