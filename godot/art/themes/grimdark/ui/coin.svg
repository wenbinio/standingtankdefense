<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Grimdark "Ashen Vigil" — coin: grim gold coin, brass face + iron rim. -->
  <defs>
    <!-- Brass face: lit top blending to shadowed underside (volume). -->
    <radialGradient id="cn_face" cx="42%" cy="36%" r="68%">
      <stop offset="0%"   stop-color="#B08A45"/>
      <stop offset="48%"  stop-color="#8A6A33"/>
      <stop offset="100%" stop-color="#4A3A1C"/>
    </radialGradient>
    <linearGradient id="cn_rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3B4655"/>
      <stop offset="100%" stop-color="#1C212B"/>
    </linearGradient>
    <filter id="cn_ao" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="cn_glint" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <!-- AO drop under coin -->
  <ellipse cx="24" cy="40" rx="14" ry="3.5" fill="#06070A" opacity="0.5" filter="url(#cn_ao)"/>

  <!-- Iron rim (crisp dark silhouette) -->
  <circle cx="24" cy="24" r="19" fill="url(#cn_rim)" stroke="#06070A" stroke-width="1.5"/>
  <!-- Brass face inset -->
  <circle cx="24" cy="24" r="14.5" fill="url(#cn_face)" stroke="#4A3A1C" stroke-width="1"/>

  <!-- AO tucked at face/rim seam -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="#06070A" stroke-width="2" opacity="0.35" filter="url(#cn_ao)"/>

  <!-- Embossed mark on face: a grim sigil (cross-bar coin face) -->
  <g stroke="#4A3A1C" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="24" y1="16" x2="24" y2="32"/>
    <line x1="16" y1="24" x2="32" y2="24"/>
  </g>
  <circle cx="24" cy="24" r="4.5" fill="none" stroke="#B08A45" stroke-width="1.2" opacity="0.7"/>

  <!-- Warm rim catch on the lit upper-left edge (one accent) -->
  <path d="M 11 18 A 14.5 14.5 0 0 1 22 10.2" fill="none" stroke="#D8B45A"
        stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

  <!-- Faint cold glint (a single cool spark on the metal) -->
  <circle cx="17" cy="17" r="1.8" fill="#5BC8E6" opacity="0.55" filter="url(#cn_glint)"/>
</svg>
