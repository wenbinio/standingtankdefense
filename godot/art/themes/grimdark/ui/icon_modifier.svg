<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Grimdark "Ashen Vigil" — icon_modifier: cold rune-gem upgrade icon. -->
  <!-- glow_cold emissive gem in an iron/brass setting. Centered, bold at 32px. -->
  <defs>
    <!-- Gem facets: bright cold core to deep cold shadow. -->
    <radialGradient id="im_gem" cx="44%" cy="36%" r="70%">
      <stop offset="0%"   stop-color="#CFF3FC"/>
      <stop offset="40%"  stop-color="#5BC8E6"/>
      <stop offset="100%" stop-color="#163E4C"/>
    </radialGradient>
    <linearGradient id="im_set" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5A6677"/>
      <stop offset="100%" stop-color="#1C212B"/>
    </linearGradient>
    <linearGradient id="im_brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A07C3C"/>
      <stop offset="100%" stop-color="#4A3A1C"/>
    </linearGradient>
    <filter id="im_glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="im_ao" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- Ground AO -->
  <ellipse cx="32" cy="55" rx="15" ry="3.6" fill="#06070A" opacity="0.45" filter="url(#im_ao)"/>

  <!-- Upgrade chevron behind the gem (the "upgrade" read), brass -->
  <path d="M 32 47 L 18 58 L 18 50 L 32 39 L 46 50 L 46 58 Z"
        fill="url(#im_brass)" stroke="#06070A" stroke-width="1.6" stroke-linejoin="round" opacity="0.95"/>

  <!-- Soft cold halo behind the gem (emissive core) -->
  <circle cx="32" cy="26" r="16" fill="#5BC8E6" opacity="0.4" filter="url(#im_glow)"/>

  <!-- Iron prong setting (dark silhouette) -->
  <path d="M 32 6 L 50 26 L 32 46 L 14 26 Z"
        fill="url(#im_set)" stroke="#06070A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- AO tucked into the setting interior -->
  <path d="M 32 9 L 47 26 L 32 43 L 17 26 Z" fill="none" stroke="#06070A"
        stroke-width="2.4" opacity="0.4" filter="url(#im_ao)"/>

  <!-- The cold rune-gem (crisp facet) -->
  <path d="M 32 11 L 44 26 L 32 41 L 20 26 Z"
        fill="url(#im_gem)" stroke="#163E4C" stroke-width="1"/>
  <!-- Facet split lines -->
  <g stroke="#163E4C" stroke-width="0.9" opacity="0.7">
    <line x1="32" y1="11" x2="32" y2="41"/>
    <line x1="20" y1="26" x2="44" y2="26"/>
  </g>
  <!-- Rune mark etched in the gem -->
  <path d="M 32 18 L 32 34 M 28 22 L 36 22 M 28 30 L 36 30" stroke="#163E4C"
        stroke-width="1.2" stroke-linecap="round" opacity="0.6" fill="none"/>
  <!-- Bright facet glint + cold rim catch -->
  <path d="M 26 22 L 32 14 L 30 24 Z" fill="#E6FBFF" opacity="0.85"/>
  <path d="M 32 11 L 20 26" stroke="#9BDDF0" stroke-width="1.3" stroke-linecap="round" opacity="0.7" fill="none"/>
</svg>
