<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Grimdark "Ashen Vigil" — icon_weapon: generic iron cannon, brass fittings. -->
  <!-- Ally/neutral palette. Authored facing UP (north). Centered, bold at 32px. -->
  <defs>
    <!-- Cannon barrel: lit left flank to shadowed right (cylinder volume). -->
    <linearGradient id="iw_barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1C212B"/>
      <stop offset="35%"  stop-color="#3B4655"/>
      <stop offset="58%"  stop-color="#6E7C8C"/>
      <stop offset="80%"  stop-color="#3B4655"/>
      <stop offset="100%" stop-color="#1C212B"/>
    </linearGradient>
    <linearGradient id="iw_base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3B4655"/>
      <stop offset="100%" stop-color="#1C212B"/>
    </linearGradient>
    <linearGradient id="iw_brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4A3A1C"/>
      <stop offset="50%"  stop-color="#A07C3C"/>
      <stop offset="100%" stop-color="#4A3A1C"/>
    </linearGradient>
    <filter id="iw_ao" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="iw_glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Ground AO under the carriage -->
  <ellipse cx="32" cy="54" rx="18" ry="4.5" fill="#06070A" opacity="0.5" filter="url(#iw_ao)"/>

  <!-- Carriage base block -->
  <rect x="20" y="40" width="24" height="13" rx="3" fill="url(#iw_base)"
        stroke="#06070A" stroke-width="2"/>
  <!-- Wheels / trunnion bolts -->
  <circle cx="23" cy="46.5" r="3.4" fill="#1C212B" stroke="#06070A" stroke-width="1.4"/>
  <circle cx="41" cy="46.5" r="3.4" fill="#1C212B" stroke="#06070A" stroke-width="1.4"/>
  <circle cx="23" cy="46.5" r="1.2" fill="#8A6A33"/>
  <circle cx="41" cy="46.5" r="1.2" fill="#8A6A33"/>

  <!-- Barrel pointing UP (north) -->
  <rect x="25" y="10" width="14" height="34" rx="5" fill="url(#iw_barrel)"
        stroke="#06070A" stroke-width="2"/>
  <!-- AO at barrel/base seam -->
  <ellipse cx="32" cy="42" rx="9" ry="3" fill="#06070A" opacity="0.4" filter="url(#iw_ao)"/>

  <!-- Brass reinforcing bands around barrel -->
  <rect x="24" y="18" width="16" height="3.4" rx="1.6" fill="url(#iw_brass)" stroke="#4A3A1C" stroke-width="0.6"/>
  <rect x="24" y="30" width="16" height="3.4" rx="1.6" fill="url(#iw_brass)" stroke="#4A3A1C" stroke-width="0.6"/>

  <!-- Muzzle ring + dark bore -->
  <ellipse cx="32" cy="11" rx="7.5" ry="3" fill="#1C212B" stroke="#06070A" stroke-width="1.5"/>
  <ellipse cx="32" cy="11" rx="4" ry="1.6" fill="#06070A"/>

  <!-- One cold rim catch on the lit (left) barrel edge -->
  <path d="M 26 13 L 26 41" fill="none" stroke="#6E7C8C" stroke-width="1.6"
        stroke-linecap="round" opacity="0.8"/>

  <!-- Faint cold muzzle glint (ally read), only on this emissive hint -->
  <circle cx="32" cy="11" r="2.2" fill="#5BC8E6" opacity="0.5" filter="url(#iw_glow)"/>
</svg>
