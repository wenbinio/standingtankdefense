<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- GRIMDARK player projectile: double-bit steel AXE, brass haft, bold silhouette, -->
  <!-- slight spin blur. Travel = UP, no baked rotation. Centered, ~8% margin. -->
  <defs>
    <!-- steel blade volume: top-front lit -> shadow -->
    <linearGradient id="x_blade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#6E7C8C"/>
      <stop offset="45%" stop-color="#3B4655"/>
      <stop offset="100%" stop-color="#1C212B"/>
    </linearGradient>
    <!-- brass haft cylinder: left lit -> right shadow -->
    <linearGradient id="x_haft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#1C212B"/>
      <stop offset="30%" stop-color="#B89A5A"/>
      <stop offset="55%" stop-color="#8A6A33"/>
      <stop offset="100%" stop-color="#3A2C12"/>
    </linearGradient>
    <!-- spin blur arc -->
    <linearGradient id="x_spin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#3B4655" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6E7C8C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3B4655" stop-opacity="0"/>
    </linearGradient>
    <filter id="x_blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="x_ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- spin-blur ghost arcs of the bits (suggest rotation) -->
  <path d="M6 24 Q24 12 42 24" fill="none" stroke="url(#x_spin)" stroke-width="5" filter="url(#x_blur)" stroke-linecap="round"/>
  <path d="M6 24 Q24 36 42 24" fill="none" stroke="url(#x_spin)" stroke-width="5" filter="url(#x_blur)" stroke-linecap="round"/>

  <!-- AO behind head -->
  <ellipse cx="24" cy="24" rx="18" ry="9" fill="#06070A" opacity="0.4" filter="url(#x_ao)"/>

  <!-- brass haft (vertical, runs UP) -->
  <rect x="21.5" y="8" width="5" height="34" rx="2" fill="url(#x_haft)" stroke="#2A2010" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- haft rim catch -->
  <rect x="22.3" y="10" width="1.2" height="28" rx="0.6" fill="#B89A5A" opacity="0.7"/>

  <!-- LEFT bit (steel, crescent) -->
  <path d="M22 13 C12 13 5 19 4 24 C5 29 12 35 22 35 C18 30 17 27 17 24 C17 21 18 18 22 13 Z"
        fill="url(#x_blade)" stroke="#0E1117" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- RIGHT bit (steel, crescent) -->
  <path d="M26 13 C36 13 43 19 44 24 C43 29 36 35 26 35 C30 30 31 27 31 24 C31 21 30 18 26 13 Z"
        fill="url(#x_blade)" stroke="#0E1117" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- deep AO on lower (away) half of both bits -->
  <path d="M4 24 C5 29 12 35 22 35 C18 30 17 27 17 24 C13 27 8 27 4 24 Z" fill="#06070A" opacity="0.45" filter="url(#x_ao)"/>
  <path d="M44 24 C43 29 36 35 26 35 C30 30 31 27 31 24 C35 27 40 27 44 24 Z" fill="#06070A" opacity="0.5" filter="url(#x_ao)"/>

  <!-- single rim catch on the lit (upper) cutting edges -->
  <path d="M22 13 C13 13 6 19 4.5 24" fill="none" stroke="#6E7C8C" stroke-width="1.6" opacity="0.8" stroke-linecap="round"/>
  <path d="M26 13 C35 13 42 19 43.5 24" fill="none" stroke="#6E7C8C" stroke-width="1.4" opacity="0.6" stroke-linecap="round"/>

  <!-- brass eye/collar over haft center -->
  <rect x="19" y="20" width="10" height="9" rx="2" fill="#8A6A33" stroke="#2A2010" stroke-width="1.3"/>
  <rect x="20.5" y="21.5" width="3" height="6" rx="1.2" fill="#B89A5A" opacity="0.6"/>
</svg>
