<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- Standing Tank Defense - GRIMDARK ENEMY "Mountain Giant" (Fortified, slow, immense) -->
  <!-- High 3/4 top-down. Facing UP (north, -Y). No baked rotation. Centered, ~8% margin. -->
  <!-- Biggest non-boss: scaled up (140) vs the 96 swarm, but smaller than Samwise (320). -->
  <!-- Stone-plated rock-ogre: slab limbs, moss-grimed granite armor; faint ember magma seams. -->
  <defs>
    <!-- granite stone-plate volume (cool grey, warm key upper-front) -->
    <radialGradient id="mg_stone" cx="44%" cy="26%" r="90%">
      <stop offset="0%"  stop-color="#8A8478"/>
      <stop offset="48%" stop-color="#55514A"/>
      <stop offset="100%" stop-color="#1C1A17"/>
    </radialGradient>
    <!-- darker recessed stone (away / under-plate) -->
    <radialGradient id="mg_dark" cx="50%" cy="32%" r="84%">
      <stop offset="0%"  stop-color="#5A554C"/>
      <stop offset="60%" stop-color="#322F2A"/>
      <stop offset="100%" stop-color="#131210"/>
    </radialGradient>
    <!-- mossy grimed flesh in the joints (sickly green tie to the orcs) -->
    <radialGradient id="mg_moss" cx="50%" cy="35%" r="80%">
      <stop offset="0%"  stop-color="#5C6B4A"/>
      <stop offset="60%" stop-color="#3D472D"/>
      <stop offset="100%" stop-color="#14180E"/>
    </radialGradient>
    <!-- magma seam glow (warm enemy ember read) -->
    <radialGradient id="mg_ember" cx="50%" cy="45%" r="62%">
      <stop offset="0%"  stop-color="#FFE7B0"/>
      <stop offset="35%" stop-color="#FF7A2E"/>
      <stop offset="80%" stop-color="#6E1F1C"/>
      <stop offset="100%" stop-color="#2A0A04"/>
    </radialGradient>
    <filter id="mg_ember_glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="mg_ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- heavy ground shadow under the immense bulk -->
  <ellipse cx="70" cy="120" rx="52" ry="13" fill="#06070A" opacity="0.6"/>
  <ellipse cx="70" cy="122" rx="34" ry="8" fill="#06070A" opacity="0.5"/>

  <!-- ================= SLAB ARMS / FISTS (huge, to either flank, forward) ================= -->
  <!-- left arm slab -->
  <path d="M14 50 C8 56 8 78 16 92 C24 102 34 100 38 90 L34 56 C30 48 20 46 14 50 Z"
        fill="url(#mg_dark)" stroke="#0A0B0F" stroke-width="4" stroke-linejoin="round"/>
  <!-- right arm slab -->
  <path d="M126 50 C132 56 132 78 124 92 C116 102 106 100 102 90 L106 56 C110 48 120 46 126 50 Z"
        fill="url(#mg_dark)" stroke="#0A0B0F" stroke-width="4" stroke-linejoin="round"/>
  <!-- boulder fists (north reach) -->
  <ellipse cx="22" cy="48" rx="15" ry="14" fill="url(#mg_stone)" stroke="#0A0B0F" stroke-width="4"/>
  <ellipse cx="118" cy="48" rx="15" ry="14" fill="url(#mg_stone)" stroke="#0A0B0F" stroke-width="4"/>
  <!-- knuckle cracks (magma) -->
  <g stroke="#6E1F1C" stroke-width="2" opacity="0.7" stroke-linecap="round">
    <path d="M16 44 L28 44"/><path d="M18 52 L26 52"/>
    <path d="M112 44 L124 44"/><path d="M114 52 L122 52"/>
  </g>

  <!-- ================= MASSIVE TORSO / STONE-PLATED BACK (away/south) ================= -->
  <path d="M70 112
           C36 112 24 92 24 70
           C24 48 42 36 70 36
           C98 36 116 48 116 70
           C116 92 104 112 70 112 Z"
        fill="url(#mg_dark)" stroke="#0A0B0F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M24 70 C24 92 36 112 70 112 C104 112 116 92 116 70
           C116 90 96 100 70 100 C44 100 24 90 24 70 Z"
        fill="#06070A" opacity="0.55" filter="url(#mg_ao)"/>

  <!-- overlapping granite armor plates across the back -->
  <g stroke="#0A0B0F" stroke-width="3.5" stroke-linejoin="round">
    <path d="M34 64 C44 56 62 54 70 54 C78 54 96 56 106 64 C96 70 44 70 34 64 Z" fill="url(#mg_stone)"/>
    <path d="M40 78 C50 72 62 70 70 70 C78 70 90 72 100 78 C90 84 50 84 40 78 Z" fill="url(#mg_dark)"/>
  </g>
  <!-- moss grime in the plate seams -->
  <path d="M34 64 C44 70 96 70 106 64" fill="none" stroke="#3D472D" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <!-- magma cracks bleeding through the stone -->
  <path d="M52 56 C50 70 54 84 52 100" fill="none" stroke="#FF7A2E" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
  <path d="M88 58 C90 72 86 86 88 102" fill="none" stroke="#FF7A2E" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- ================= HULKING STONE SHOULDER PAULDRONS ================= -->
  <ellipse cx="44" cy="58" rx="22" ry="22" fill="url(#mg_stone)" stroke="#0A0B0F" stroke-width="5"/>
  <ellipse cx="96" cy="58" rx="22" ry="22" fill="url(#mg_stone)" stroke="#0A0B0F" stroke-width="5"/>
  <!-- craggy spike outcrops on pauldrons -->
  <g fill="url(#mg_stone)" stroke="#0A0B0F" stroke-width="3" stroke-linejoin="round">
    <path d="M34 40 L28 22 L48 38 Z"/>
    <path d="M106 40 L112 22 L92 38 Z"/>
  </g>
  <!-- AO where pauldrons meet head -->
  <ellipse cx="58" cy="62" rx="9" ry="16" fill="#06070A" opacity="0.45" filter="url(#mg_ao)"/>
  <ellipse cx="82" cy="62" rx="9" ry="16" fill="#06070A" opacity="0.45" filter="url(#mg_ao)"/>
  <!-- cool rim catch on lit pauldron tops -->
  <path d="M26 54 C30 38 42 32 56 36" fill="none" stroke="#8A8478" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <path d="M114 54 C110 38 98 32 84 36" fill="none" stroke="#8A8478" stroke-width="4" opacity="0.45" stroke-linecap="round"/>

  <!-- ================= BLUNT STONE HEAD (small, sunk between shoulders, north) ================= -->
  <path d="M70 46
           C84 46 90 58 90 70
           C90 82 81 90 70 90
           C59 90 50 82 50 70
           C50 58 56 46 70 46 Z"
        fill="url(#mg_moss)" stroke="#0A0B0F" stroke-width="4.5" stroke-linejoin="round"/>
  <ellipse cx="70" cy="66" rx="18" ry="6" fill="#06070A" opacity="0.5" filter="url(#mg_ao)"/>
  <!-- heavy stone brow slab -->
  <path d="M54 62 C60 50 80 50 86 62 C78 56 62 56 54 62 Z"
        fill="url(#mg_stone)" stroke="#0A0B0F" stroke-width="3" stroke-linejoin="round"/>

  <!-- deep-sunk magma-ember eyes (warm focal read) -->
  <g>
    <circle cx="62" cy="70" r="7" fill="#FF7A2E" opacity="0.7" filter="url(#mg_ember_glow)"/>
    <circle cx="78" cy="70" r="7" fill="#FF7A2E" opacity="0.7" filter="url(#mg_ember_glow)"/>
    <ellipse cx="62" cy="70" rx="5" ry="4.2" fill="#0A0B0F"/>
    <ellipse cx="78" cy="70" rx="5" ry="4.2" fill="#0A0B0F"/>
    <circle cx="62" cy="70" r="2.8" fill="url(#mg_ember)"/>
    <circle cx="78" cy="70" r="2.8" fill="url(#mg_ember)"/>
    <circle cx="61" cy="69" r="1" fill="#FFE7B0"/>
    <circle cx="77" cy="69" r="1" fill="#FFE7B0"/>
  </g>

  <!-- craggy stone jaw / grimace (lower head) -->
  <path d="M58 80 C64 77 76 77 82 80 C78 88 62 88 58 80 Z"
        fill="#131210" stroke="#0A0B0F" stroke-width="2.6"/>
  <!-- broken stone teeth -->
  <g fill="url(#mg_stone)" stroke="#0A0B0F" stroke-width="1">
    <path d="M62 81 L64 88 L68 81 Z"/>
    <path d="M72 81 L74 88 L78 81 Z"/>
  </g>
</svg>
