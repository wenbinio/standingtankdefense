<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - GRIMDARK ENEMY "Steam Tank" (slow, armored war-machine) -->
  <!-- High 3/4 top-down. Facing UP (north, -Y). No baked rotation. Centered, ~8% margin. -->
  <!-- Painterly: gradient lit/shadow worn-metal volume, AO seams, rim catch, crisp dark rim. -->
  <!-- ENEMY read: rusted grimy iron, bone/rivet detail, belching ember furnace, treads. -->
  <defs>
    <!-- rusted grimy iron hull volume (warm key upper-front) -->
    <radialGradient id="t_hull" cx="42%" cy="28%" r="90%">
      <stop offset="0%"  stop-color="#8A6A33"/>
      <stop offset="35%" stop-color="#5A3A22"/>
      <stop offset="70%" stop-color="#3B4655"/>
      <stop offset="100%" stop-color="#1C212B"/>
    </radialGradient>
    <!-- worn metal plate (rusty steel) -->
    <linearGradient id="t_plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#6E7C8C"/>
      <stop offset="45%" stop-color="#3B4655"/>
      <stop offset="75%" stop-color="#5A3A22"/>
      <stop offset="100%" stop-color="#15171E"/>
    </linearGradient>
    <!-- tread cylinder (left lit -> shadow) -->
    <linearGradient id="t_tread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#3B4655"/>
      <stop offset="35%" stop-color="#2A2E38"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>
    <!-- furnace ember glow core -->
    <radialGradient id="t_ember" cx="50%" cy="45%" r="65%">
      <stop offset="0%"  stop-color="#FFE7B0"/>
      <stop offset="35%" stop-color="#FF7A2E"/>
      <stop offset="80%" stop-color="#6E1F1C"/>
      <stop offset="100%" stop-color="#2A0A04"/>
    </radialGradient>
    <!-- bone trophy -->
    <linearGradient id="t_bone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#E6E0CC"/>
      <stop offset="50%" stop-color="#C9C1A8"/>
      <stop offset="100%" stop-color="#74705C"/>
    </linearGradient>
    <filter id="t_ember_glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="t_ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- ground shadow under the bulk -->
  <ellipse cx="48" cy="83" rx="36" ry="9" fill="#06070A" opacity="0.6"/>
  <ellipse cx="48" cy="84" rx="24" ry="5.5" fill="#06070A" opacity="0.5"/>

  <!-- ================= TREADS (both flanks, run north-south) ================= -->
  <!-- left tread -->
  <rect x="8" y="22" width="18" height="58" rx="9" fill="url(#t_tread)" stroke="#0E1117" stroke-width="3" stroke-linejoin="round"/>
  <!-- right tread -->
  <rect x="70" y="22" width="18" height="58" rx="9" fill="url(#t_tread)" stroke="#0E1117" stroke-width="3" stroke-linejoin="round"/>
  <!-- tread cleats -->
  <g stroke="#06070A" stroke-width="2" opacity="0.7" stroke-linecap="round">
    <path d="M9 32 L25 32"/><path d="M9 42 L25 42"/><path d="M9 52 L25 52"/>
    <path d="M9 62 L25 62"/><path d="M9 72 L25 72"/>
    <path d="M71 32 L87 32"/><path d="M71 42 L87 42"/><path d="M71 52 L87 52"/>
    <path d="M71 62 L87 62"/><path d="M71 72 L87 72"/>
  </g>
  <!-- rim catch on lit (left) tread edge -->
  <rect x="10" y="26" width="2.6" height="50" rx="1.3" fill="#6E7C8C" opacity="0.6"/>
  <!-- AO where treads meet hull -->
  <rect x="24" y="26" width="6" height="50" fill="#06070A" opacity="0.45" filter="url(#t_ao)"/>
  <rect x="66" y="26" width="6" height="50" fill="#06070A" opacity="0.45" filter="url(#t_ao)"/>

  <!-- ================= MAIN HULL (heavy rusted iron box) ================= -->
  <path d="M28 26
           L68 26
           C72 26 74 30 74 34
           L74 76 C74 80 71 82 67 82
           L29 82 C25 82 22 80 22 76
           L22 34 C22 30 24 26 28 26 Z"
        fill="url(#t_hull)" stroke="#0E1117" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- deep AO on the away (lower/south) half -->
  <path d="M22 60 L74 60 L74 76 C74 80 71 82 67 82 L29 82 C25 82 22 80 22 76 Z"
        fill="#06070A" opacity="0.5" filter="url(#t_ao)"/>
  <!-- plate seams (sparse AO grooves) -->
  <path d="M22 48 L74 48" stroke="#06070A" stroke-width="2.2" opacity="0.5" stroke-linecap="round"/>
  <path d="M48 26 L48 60" stroke="#06070A" stroke-width="1.8" opacity="0.4" stroke-linecap="round"/>
  <!-- rust streaks bleeding down the hull -->
  <path d="M34 50 C33 60 36 68 34 78" fill="none" stroke="#5A3A22" stroke-width="2.2" opacity="0.55" stroke-linecap="round"/>
  <path d="M62 52 C63 62 60 70 62 80" fill="none" stroke="#5A3A22" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <!-- single warm rim on lit forward-left hull edge -->
  <path d="M28 28 C40 26 58 26 68 28" fill="none" stroke="#6E7C8C" stroke-width="2.4" opacity="0.5" stroke-linecap="round"/>
  <path d="M25 34 L25 58" fill="none" stroke="#6E7C8C" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- ================= ARMORED FRONT PLATE / GLACIS (toward north) ================= -->
  <path d="M30 22 L66 22 L70 34 L26 34 Z"
        fill="url(#t_plate)" stroke="#0E1117" stroke-width="3" stroke-linejoin="round"/>
  <!-- bolted rivets along the front plate -->
  <g fill="#8A6A33" stroke="#2A2010" stroke-width="0.8">
    <circle cx="33" cy="28" r="2.2"/>
    <circle cx="48" cy="27" r="2.2"/>
    <circle cx="63" cy="28" r="2.2"/>
  </g>

  <!-- ================= BELCHING FURNACE (raised, center hull, ember glow) ================= -->
  <!-- iron furnace housing -->
  <ellipse cx="48" cy="56" rx="18" ry="16" fill="url(#t_plate)" stroke="#0E1117" stroke-width="3"/>
  <!-- AO ring under furnace lip -->
  <ellipse cx="48" cy="62" rx="15" ry="7" fill="#06070A" opacity="0.45" filter="url(#t_ao)"/>
  <!-- furnace grate mouth glow -->
  <circle cx="48" cy="54" r="14" fill="#FF7A2E" opacity="0.5" filter="url(#t_ember_glow)"/>
  <ellipse cx="48" cy="54" rx="11" ry="10" fill="#0A0B0F" stroke="#8A6A33" stroke-width="2.4"/>
  <ellipse cx="48" cy="54" rx="8" ry="7.5" fill="url(#t_ember)"/>
  <!-- iron grate bars across the furnace mouth -->
  <g stroke="#1C212B" stroke-width="2" opacity="0.85" stroke-linecap="round">
    <path d="M41 50 L55 50"/>
    <path d="M40 54 L56 54"/>
    <path d="M41 58 L55 58"/>
  </g>
  <circle cx="45" cy="51" r="1.6" fill="#FFE7B0"/>

  <!-- ================= EXHAUST STACK belching ember smoke (toward north) ================= -->
  <rect x="42" y="14" width="12" height="20" rx="3" fill="url(#t_plate)" stroke="#0E1117" stroke-width="2.6"/>
  <!-- ember vent glow from stack mouth -->
  <ellipse cx="48" cy="16" rx="7" ry="4" fill="#FF7A2E" opacity="0.55" filter="url(#t_ember_glow)"/>
  <ellipse cx="48" cy="17" rx="4" ry="2.4" fill="url(#t_ember)"/>
  <!-- brass band on the stack -->
  <rect x="41" y="24" width="14" height="4" rx="1.5" fill="#8A6A33" stroke="#2A2010" stroke-width="1.4"/>
  <!-- rim catch on lit stack edge -->
  <rect x="43.5" y="16" width="2" height="16" rx="1" fill="#6E7C8C" opacity="0.6"/>

  <!-- ================= BONE TROPHY lashed to hull corner (enemy menace) ================= -->
  <g stroke="#5A5848" stroke-width="1" stroke-linejoin="round">
    <path d="M24 74 L20 66 L28 72 Z" fill="url(#t_bone)"/>
  </g>
  <!-- dried-blood smear at the trophy -->
  <path d="M24 74 C23 78 25 80 24 82" fill="none" stroke="#6E1F1C" stroke-width="1.8" opacity="0.65" stroke-linecap="round"/>

  <!-- corner rivets (dim brass, sparse) -->
  <g fill="#8A6A33" stroke="#2A2010" stroke-width="0.8">
    <circle cx="28" cy="38" r="2"/>
    <circle cx="68" cy="38" r="2"/>
    <circle cx="28" cy="76" r="2"/>
    <circle cx="68" cy="76" r="2"/>
  </g>
</svg>
