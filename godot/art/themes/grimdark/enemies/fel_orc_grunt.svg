<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - GRIMDARK ENEMY "Fel-Orc Grunt" (basic fast/weak mob) -->
  <!-- High 3/4 top-down. Facing UP (north, -Y). No baked rotation. Centered, ~8% margin. -->
  <!-- Painterly: gradient lit/shadow flesh volume, AO seams, rim catches, crisp dark rim. -->
  <!-- ENEMY read: diseased green flesh, bone tusks, rusted blade, ember eyes, dried blood. -->
  <defs>
    <!-- diseased flesh volume (warm key from upper-front) -->
    <radialGradient id="o_flesh" cx="42%" cy="30%" r="88%">
      <stop offset="0%"  stop-color="#8A9468"/>
      <stop offset="48%" stop-color="#5C6B4A"/>
      <stop offset="100%" stop-color="#222A1A"/>
    </radialGradient>
    <!-- hunched shoulder/back mass (darker) -->
    <radialGradient id="o_back" cx="50%" cy="34%" r="82%">
      <stop offset="0%"  stop-color="#6E7B52"/>
      <stop offset="60%" stop-color="#3D472D"/>
      <stop offset="100%" stop-color="#181E10"/>
    </radialGradient>
    <!-- bone tusks / claws -->
    <linearGradient id="o_bone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#E6E0CC"/>
      <stop offset="50%" stop-color="#C9C1A8"/>
      <stop offset="100%" stop-color="#74705C"/>
    </linearGradient>
    <!-- rusted iron blade -->
    <linearGradient id="o_blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#6E7C8C"/>
      <stop offset="40%" stop-color="#3B4655"/>
      <stop offset="70%" stop-color="#5A3A22"/>
      <stop offset="100%" stop-color="#1C212B"/>
    </linearGradient>
    <!-- ember eye core -->
    <radialGradient id="o_ember" cx="50%" cy="45%" r="60%">
      <stop offset="0%"  stop-color="#FFE7B0"/>
      <stop offset="35%" stop-color="#FF7A2E"/>
      <stop offset="100%" stop-color="#5A1D06"/>
    </radialGradient>
    <filter id="o_ember_glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="o_ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- ground shadow under pivot -->
  <ellipse cx="48" cy="82" rx="30" ry="9" fill="#06070A" opacity="0.55"/>
  <ellipse cx="48" cy="83" rx="20" ry="5.5" fill="#06070A" opacity="0.45"/>

  <!-- ================= RUSTED BLADE (raised in right fist, toward north) ================= -->
  <!-- cast shadow of blade -->
  <path d="M70 22 L77 22 L75 64 L69 64 Z" fill="#06070A" opacity="0.4" filter="url(#o_ao)"/>
  <!-- crude jagged blade -->
  <path d="M66 60 L64 24 L70 12 L76 24 L74 60 Z"
        fill="url(#o_blade)" stroke="#0E1117" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- rust pitting -->
  <path d="M68 32 L72 40 L68 48" fill="none" stroke="#5A3A22" stroke-width="1.4" opacity="0.7" stroke-linecap="round"/>
  <!-- rim catch on lit blade edge -->
  <path d="M67 24 L65 58" fill="none" stroke="#6E7C8C" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/>
  <!-- crude bone-wrapped grip -->
  <rect x="65" y="60" width="10" height="10" rx="2" fill="#3D472D" stroke="#0E1117" stroke-width="2"/>

  <!-- ================= HUNCHED BACK / SHOULDER HUMP (lower = away/south) ================= -->
  <path d="M48 78
           C24 78 16 64 16 50
           C16 36 28 28 48 28
           C68 28 80 36 80 50
           C80 64 72 78 48 78 Z"
        fill="url(#o_back)" stroke="#0A0B0F" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- AO trench under the hunch -->
  <path d="M16 50 C16 64 24 78 48 78 C72 78 80 64 80 50
           C80 60 66 68 48 68 C30 68 16 60 16 50 Z"
        fill="#06070A" opacity="0.5" filter="url(#o_ao)"/>

  <!-- ================= SHOULDER MASSES (to either side) ================= -->
  <ellipse cx="30" cy="50" rx="17" ry="19" fill="url(#o_flesh)" stroke="#0A0B0F" stroke-width="3.2"/>
  <ellipse cx="66" cy="50" rx="17" ry="19" fill="url(#o_flesh)" stroke="#0A0B0F" stroke-width="3.2"/>
  <!-- AO seam where shoulders meet head -->
  <ellipse cx="40" cy="54" rx="7" ry="12" fill="#06070A" opacity="0.4" filter="url(#o_ao)"/>
  <ellipse cx="56" cy="54" rx="7" ry="12" fill="#06070A" opacity="0.4" filter="url(#o_ao)"/>
  <!-- bone spine spikes erupting from left shoulder -->
  <g stroke="#5A5848" stroke-width="1.4" stroke-linejoin="round">
    <path d="M20 40 L14 26 L26 38 Z" fill="url(#o_bone)"/>
    <path d="M30 34 L32 22 L40 34 Z" fill="url(#o_bone)"/>
  </g>
  <!-- single warm rim on lit shoulder top -->
  <path d="M18 46 C20 34 30 28 40 30" fill="none" stroke="#8A9468" stroke-width="2.2" opacity="0.5" stroke-linecap="round"/>

  <!-- dried-blood gore on shoulder -->
  <path d="M30 60 C28 67 31 72 29 78" fill="none" stroke="#6E1F1C" stroke-width="2.4" opacity="0.7" stroke-linecap="round"/>

  <!-- ================= HEAD (center, forward = north) ================= -->
  <path d="M48 40
           C61 40 68 50 68 62
           C68 73 59 80 48 80
           C37 80 28 73 28 62
           C28 50 35 40 48 40 Z"
        fill="url(#o_flesh)" stroke="#0A0B0F" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- AO under heavy brow -->
  <ellipse cx="48" cy="56" rx="16" ry="6" fill="#06070A" opacity="0.45" filter="url(#o_ao)"/>
  <!-- heavy bone brow ridge over eyes -->
  <path d="M34 52 C40 42 56 42 62 52 C56 47 40 47 34 52 Z"
        fill="url(#o_bone)" stroke="#5A5848" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- ================= EMBER EYES (enemy WARM glow read) ================= -->
  <g>
    <circle cx="42" cy="58" r="6" fill="#FF7A2E" opacity="0.7" filter="url(#o_ember_glow)"/>
    <circle cx="54" cy="58" r="6" fill="#FF7A2E" opacity="0.7" filter="url(#o_ember_glow)"/>
    <ellipse cx="42" cy="58" rx="4.5" ry="3.8" fill="#0A0B0F"/>
    <ellipse cx="54" cy="58" rx="4.5" ry="3.8" fill="#0A0B0F"/>
    <circle cx="42" cy="58" r="2.6" fill="url(#o_ember)"/>
    <circle cx="54" cy="58" r="2.6" fill="url(#o_ember)"/>
    <circle cx="41" cy="57" r="0.9" fill="#FFE7B0"/>
    <circle cx="53" cy="57" r="0.9" fill="#FFE7B0"/>
  </g>

  <!-- ================= SNARLING MAW + TUSKS (lower head) ================= -->
  <path d="M40 68 C45 65 51 65 56 68 C53 78 43 78 40 68 Z"
        fill="#350C0B" stroke="#0A0B0F" stroke-width="1.8"/>
  <!-- jutting bone tusks from lower jaw -->
  <g stroke="#5A5848" stroke-width="1" stroke-linejoin="round">
    <path d="M40 70 L36 60 L43 68 Z" fill="url(#o_bone)"/>
    <path d="M56 70 L60 60 L53 68 Z" fill="url(#o_bone)"/>
    <path d="M44 73 L46 67 L48 73 Z" fill="url(#o_bone)"/>
    <path d="M48 73 L50 67 L52 73 Z" fill="url(#o_bone)"/>
  </g>
  <!-- fresh blood at the maw -->
  <path d="M47 75 C48 79 50 80 49 83" fill="none" stroke="#6E1F1C" stroke-width="1.8" opacity="0.7" stroke-linecap="round"/>

  <!-- warm rim catch on lit forward cheek -->
  <path d="M32 56 C34 47 40 42 47 42" fill="none" stroke="#8A9468" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>
</svg>
