<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - GRIMDARK ENEMY "Popsicle" (ranged frost beast, tanky) -->
  <!-- High 3/4 top-down. Facing UP (north, -Y). No baked rotation. Centered, ~8% margin. -->
  <!-- BREATHER SET (matched form, 3 elements): squat maw-beast breathing from front maw. -->
  <!-- Element = ICE: pale blue frosted hide, icicle spines, cyan cryo glow; bulkier/tankier. -->
  <defs>
    <!-- frosted pale-blue hide volume -->
    <radialGradient id="ib_flesh" cx="44%" cy="26%" r="90%">
      <stop offset="0%"  stop-color="#9CC4D6"/>
      <stop offset="50%" stop-color="#4E6E84"/>
      <stop offset="100%" stop-color="#13222C"/>
    </radialGradient>
    <radialGradient id="ib_back" cx="50%" cy="34%" r="84%">
      <stop offset="0%"  stop-color="#6E94A8"/>
      <stop offset="60%" stop-color="#33505E"/>
      <stop offset="100%" stop-color="#0D161D"/>
    </radialGradient>
    <!-- cryo maw / frost-breath core (element glow) -->
    <radialGradient id="ib_cryo" cx="50%" cy="42%" r="64%">
      <stop offset="0%"  stop-color="#EAFBFF"/>
      <stop offset="35%" stop-color="#6FE0FF"/>
      <stop offset="75%" stop-color="#2A7CB8"/>
      <stop offset="100%" stop-color="#0A2638"/>
    </radialGradient>
    <!-- glassy icicle -->
    <linearGradient id="ib_ice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#EAFBFF"/>
      <stop offset="50%" stop-color="#9CD8EC"/>
      <stop offset="100%" stop-color="#3A6E86"/>
    </linearGradient>
    <filter id="ib_glow" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="ib_ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- cold frost-mist drifting off the maw (north) -->
  <ellipse cx="48" cy="16" rx="15" ry="11" fill="#6FE0FF" opacity="0.28" filter="url(#ib_glow)"/>

  <!-- ground shadow under the heavy bulk (bigger footprint, tanky) -->
  <ellipse cx="48" cy="84" rx="35" ry="9" fill="#06070A" opacity="0.58"/>
  <ellipse cx="48" cy="85" rx="23" ry="5.5" fill="#06070A" opacity="0.46"/>

  <!-- ================= SPLAYED HEAVY LEGS (4, flank corners — thicker) ================= -->
  <g fill="url(#ib_back)" stroke="#0A0B0F" stroke-width="2.8" stroke-linejoin="round">
    <ellipse cx="22" cy="44" rx="11" ry="7" transform="rotate(-30 22 44)"/>
    <ellipse cx="74" cy="44" rx="11" ry="7" transform="rotate(30 74 44)"/>
    <ellipse cx="20" cy="75" rx="11" ry="7" transform="rotate(30 20 75)"/>
    <ellipse cx="76" cy="75" rx="11" ry="7" transform="rotate(-30 76 75)"/>
  </g>

  <!-- ================= BULKY ARMORED BODY / FROSTED BACK (away/south) ================= -->
  <path d="M48 86
           C23 86 14 70 14 53
           C14 36 28 27 48 27
           C68 27 82 36 82 53
           C82 70 73 86 48 86 Z"
        fill="url(#ib_back)" stroke="#0A0B0F" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M14 53 C14 70 23 86 48 86 C73 86 82 70 82 53
           C82 66 68 73 48 73 C28 73 14 66 14 53 Z"
        fill="#06070A" opacity="0.5" filter="url(#ib_ao)"/>

  <!-- icicle spine ridge erupting along the back -->
  <g fill="url(#ib_ice)" stroke="#3A6E86" stroke-width="1.2" stroke-linejoin="round">
    <path d="M30 58 L26 44 L36 56 Z"/>
    <path d="M44 60 L42 42 L50 60 Z"/>
    <path d="M62 58 L66 44 L56 56 Z"/>
    <path d="M48 72 L46 60 L54 72 Z"/>
  </g>
  <!-- cryo glow seams (element read) -->
  <g stroke="#6FE0FF" stroke-linecap="round" opacity="0.55">
    <path d="M34 56 C33 64 35 72 34 80" stroke-width="2"/>
    <path d="M62 56 C63 64 61 72 62 80" stroke-width="1.8"/>
  </g>
  <circle cx="38" cy="66" r="4" fill="#2A7CB8" opacity="0.5" filter="url(#ib_glow)"/>
  <circle cx="58" cy="64" r="3.6" fill="#2A7CB8" opacity="0.5" filter="url(#ib_glow)"/>
  <!-- frost-rime rim on lit back -->
  <path d="M22 50 C26 36 40 31 50 33" fill="none" stroke="#9CC4D6" stroke-width="2.6" opacity="0.55" stroke-linecap="round"/>

  <!-- ================= HEAD / FROSTED MAW (front, north) ================= -->
  <path d="M48 24
           C61 24 67 35 67 46
           C67 56 59 62 48 62
           C37 62 29 56 29 46
           C29 35 35 24 48 24 Z"
        fill="url(#ib_flesh)" stroke="#0A0B0F" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- swept ice-horns -->
  <g fill="url(#ib_ice)" stroke="#3A6E86" stroke-width="1.1">
    <path d="M33 38 L24 28 L37 40 Z"/>
    <path d="M63 38 L72 28 L59 40 Z"/>
  </g>

  <!-- the breathing maw (gaping, cryo, aimed north) -->
  <circle cx="48" cy="32" r="17" fill="#6FE0FF" opacity="0.5" filter="url(#ib_glow)"/>
  <path d="M36 36 C40 22 56 22 60 36 C56 44 40 44 36 36 Z"
        fill="#0A2638" stroke="#0A0B0F" stroke-width="2.4"/>
  <path d="M40 34 C44 26 52 26 56 34 C52 39 44 39 40 34 Z"
        fill="url(#ib_cryo)"/>
  <!-- icicle fang ring (down from upper jaw + up from lower) -->
  <g fill="url(#ib_ice)" stroke="#3A6E86" stroke-width="0.7">
    <path d="M42 28 L44 22 L47 28 Z"/>
    <path d="M49 28 L52 22 L54 28 Z"/>
    <path d="M40 36 L43 43 L46 36 Z"/>
    <path d="M50 36 L53 43 L56 36 Z"/>
  </g>
  <circle cx="46" cy="31" r="1.4" fill="#EAFBFF"/>

  <!-- frost vapor curls escaping the maw (upward/north) -->
  <g fill="none" stroke="#6FE0FF" stroke-linecap="round" opacity="0.8">
    <path d="M44 22 C42 16 46 12 44 8" stroke-width="2"/>
    <path d="M52 22 C54 16 50 12 52 8" stroke-width="1.8"/>
  </g>
  <circle cx="44" cy="8" r="1.8" fill="#6FE0FF" filter="url(#ib_glow)"/>
  <circle cx="52" cy="8" r="1.6" fill="#6FE0FF" filter="url(#ib_glow)"/>

  <!-- pale cryo eyes either side of the maw -->
  <circle cx="33" cy="44" r="3.2" fill="#6FE0FF" opacity="0.7" filter="url(#ib_glow)"/>
  <circle cx="63" cy="44" r="3.2" fill="#6FE0FF" opacity="0.7" filter="url(#ib_glow)"/>
  <circle cx="33" cy="44" r="1.5" fill="#0A2638"/>
  <circle cx="63" cy="44" r="1.5" fill="#0A2638"/>
</svg>
