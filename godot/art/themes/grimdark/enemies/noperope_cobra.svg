<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - GRIMDARK ENEMY "Nope Rope" (robed ranged caster) -->
  <!-- High 3/4 top-down. Facing UP (north, -Y). No baked rotation. Centered, ~8% margin. -->
  <!-- Same snappy-animal roster (green flesh, tusks) but hunched, robed; staff + floating arcane orb. -->
  <!-- Focal read: sickly green/purple ARCANE glow (caster), not the warm ember of melee orcs. -->
  <defs>
    <!-- dark sorcerer robe volume -->
    <radialGradient id="wl_robe" cx="46%" cy="28%" r="86%">
      <stop offset="0%"  stop-color="#3A2A4A"/>
      <stop offset="55%" stop-color="#241830"/>
      <stop offset="100%" stop-color="#0E0A16"/>
    </radialGradient>
    <radialGradient id="wl_flesh" cx="42%" cy="30%" r="88%">
      <stop offset="0%"  stop-color="#8A9468"/>
      <stop offset="48%" stop-color="#5C6B4A"/>
      <stop offset="100%" stop-color="#222A1A"/>
    </radialGradient>
    <linearGradient id="wl_bone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#E6E0CC"/>
      <stop offset="50%" stop-color="#C9C1A8"/>
      <stop offset="100%" stop-color="#74705C"/>
    </linearGradient>
    <!-- arcane orb: sickly green->purple core -->
    <radialGradient id="wl_orb" cx="50%" cy="42%" r="62%">
      <stop offset="0%"  stop-color="#E6FFD0"/>
      <stop offset="30%" stop-color="#7BE85A"/>
      <stop offset="65%" stop-color="#7A3AA8"/>
      <stop offset="100%" stop-color="#1A0A2A"/>
    </radialGradient>
    <!-- caster eyes (green arcane) -->
    <radialGradient id="wl_eye" cx="50%" cy="45%" r="60%">
      <stop offset="0%"  stop-color="#E6FFD0"/>
      <stop offset="40%" stop-color="#7BE85A"/>
      <stop offset="100%" stop-color="#1E5A14"/>
    </radialGradient>
    <linearGradient id="wl_staff" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"  stop-color="#150D06"/>
      <stop offset="100%" stop-color="#4A3320"/>
    </linearGradient>
    <filter id="wl_glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="wl_eye_glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="wl_ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="48" cy="83" rx="26" ry="8" fill="#06070A" opacity="0.55"/>
  <ellipse cx="48" cy="84" rx="17" ry="5" fill="#06070A" opacity="0.45"/>

  <!-- ================= GNARLED STAFF (left hand, raised toward north) ================= -->
  <path d="M24 80 L21 22" stroke="#06070A" stroke-width="4.5" opacity="0.4" filter="url(#wl_ao)"/>
  <path d="M26 80 L23 22" stroke="url(#wl_staff)" stroke-width="3.6" stroke-linecap="round"/>
  <!-- forked crook holding the orb up north -->
  <path d="M23 24 C19 18 15 18 14 14 M23 24 C27 18 31 18 32 16"
        fill="none" stroke="url(#wl_staff)" stroke-width="3" stroke-linecap="round"/>

  <!-- floating arcane orb (focal glow, above the crook) -->
  <circle cx="23" cy="16" r="13" fill="#7BE85A" opacity="0.5" filter="url(#wl_glow)"/>
  <circle cx="23" cy="16" r="7.5" fill="url(#wl_orb)" stroke="#0E0A16" stroke-width="1.4"/>
  <circle cx="20.5" cy="13.5" r="2" fill="#E6FFD0" opacity="0.9"/>
  <!-- orbiting motes -->
  <circle cx="33" cy="14" r="1.6" fill="#7BE85A" filter="url(#wl_eye_glow)"/>
  <circle cx="14" cy="22" r="1.4" fill="#7A3AA8" filter="url(#wl_eye_glow)"/>

  <!-- ================= ROBED HUNCHED BODY (broad robe skirt, away/south) ================= -->
  <path d="M48 82
           C30 82 22 70 22 56
           C22 42 34 34 48 34
           C62 34 74 42 74 56
           C74 70 66 82 48 82 Z"
        fill="url(#wl_robe)" stroke="#0A0B0F" stroke-width="3" stroke-linejoin="round"/>
  <path d="M22 56 C22 70 30 82 48 82 C66 82 74 70 74 56
           C74 66 62 72 48 72 C34 72 22 66 22 56 Z"
        fill="#06070A" opacity="0.5" filter="url(#wl_ao)"/>
  <!-- robe folds -->
  <g stroke="#0E0A16" stroke-width="2" opacity="0.6" stroke-linecap="round">
    <path d="M38 60 C37 68 39 76 38 82"/>
    <path d="M58 60 C59 68 57 76 58 82"/>
    <path d="M48 64 L48 82"/>
  </g>
  <!-- arcane-rune hem trim (faint green) -->
  <path d="M30 78 L36 74 L42 78 L48 74 L54 78 L60 74 L66 78"
        fill="none" stroke="#7BE85A" stroke-width="1.4" opacity="0.5" stroke-linecap="round"/>

  <!-- hunched cowl shoulders -->
  <path d="M30 46 C30 36 40 32 48 32 C56 32 66 36 66 46
           C60 40 36 40 30 46 Z"
        fill="url(#wl_robe)" stroke="#0A0B0F" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- ================= HOODED HEAD (center) — green orc face in shadow ================= -->
  <path d="M48 40
           C58 40 64 48 64 58
           C64 69 57 75 48 75
           C39 75 32 69 32 58
           C32 48 38 40 48 40 Z"
        fill="url(#wl_flesh)" stroke="#0A0B0F" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- hood drape casting deep AO over upper face -->
  <path d="M32 56 C34 42 44 38 48 38 C52 38 62 42 64 56
           C58 50 38 50 32 56 Z"
        fill="#1A1226" opacity="0.85"/>
  <ellipse cx="48" cy="56" rx="13" ry="5" fill="#06070A" opacity="0.5" filter="url(#wl_ao)"/>

  <!-- arcane green eyes (caster glow read) -->
  <g>
    <circle cx="43" cy="59" r="4.6" fill="#7BE85A" opacity="0.7" filter="url(#wl_eye_glow)"/>
    <circle cx="53" cy="59" r="4.6" fill="#7BE85A" opacity="0.7" filter="url(#wl_eye_glow)"/>
    <ellipse cx="43" cy="59" rx="3.4" ry="3" fill="#0A0B0F"/>
    <ellipse cx="53" cy="59" rx="3.4" ry="3" fill="#0A0B0F"/>
    <circle cx="43" cy="59" r="2" fill="url(#wl_eye)"/>
    <circle cx="53" cy="59" r="2" fill="url(#wl_eye)"/>
    <circle cx="42.4" cy="58.4" r="0.7" fill="#E6FFD0"/>
    <circle cx="52.4" cy="58.4" r="0.7" fill="#E6FFD0"/>
  </g>

  <!-- muttering maw + twin tusks -->
  <path d="M42 67 C46 65 50 65 54 67 C51 73 45 73 42 67 Z"
        fill="#1E3A14" stroke="#0A0B0F" stroke-width="1.3"/>
  <g stroke="#5A5848" stroke-width="0.8" stroke-linejoin="round">
    <path d="M43 68 L40 61 L46 67 Z" fill="url(#wl_bone)"/>
    <path d="M53 68 L56 61 L50 67 Z" fill="url(#wl_bone)"/>
  </g>

  <!-- faint green rim on lit cowl edge -->
  <path d="M32 50 C34 40 42 36 48 36" fill="none" stroke="#7BE85A" stroke-width="1.6" opacity="0.4" stroke-linecap="round"/>
</svg>
