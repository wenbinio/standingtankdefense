<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - GRIMDARK ENEMY "Honk" (mounted human, fastest unit) -->
  <!-- High 3/4 top-down. Facing UP (north, -Y). No baked rotation. Centered, ~8% margin. -->
  <!-- Cloaked human bandit astride a lean dire-wolf mount; raised blade; reads "very fast". -->
  <!-- Painterly volume, AO seams, rim catch, crisp dark rim; cold ember eyes on the beast. -->
  <defs>
    <!-- dire-wolf mount fur volume (cool grimy grey) -->
    <radialGradient id="br_fur" cx="46%" cy="26%" r="88%">
      <stop offset="0%"  stop-color="#5A5E66"/>
      <stop offset="50%" stop-color="#33373F"/>
      <stop offset="100%" stop-color="#12141A"/>
    </radialGradient>
    <!-- bandit cloak (dark dust-red) -->
    <radialGradient id="br_cloak" cx="48%" cy="30%" r="84%">
      <stop offset="0%"  stop-color="#7A3A30"/>
      <stop offset="55%" stop-color="#4A201A"/>
      <stop offset="100%" stop-color="#160A08"/>
    </radialGradient>
    <linearGradient id="br_blade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"  stop-color="#2A2E38"/>
      <stop offset="55%" stop-color="#6E7C8C"/>
      <stop offset="100%" stop-color="#C7D2DC"/>
    </linearGradient>
    <linearGradient id="br_bone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#E6E0CC"/>
      <stop offset="50%" stop-color="#C9C1A8"/>
      <stop offset="100%" stop-color="#74705C"/>
    </linearGradient>
    <radialGradient id="br_ember" cx="50%" cy="45%" r="60%">
      <stop offset="0%"  stop-color="#FFE7B0"/>
      <stop offset="35%" stop-color="#FF7A2E"/>
      <stop offset="100%" stop-color="#5A1D06"/>
    </radialGradient>
    <radialGradient id="br_trail" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#9AA0AA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9AA0AA" stop-opacity="0"/>
    </radialGradient>
    <filter id="br_ember_glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.9"/>
    </filter>
    <filter id="br_motion" x="-40%" y="-40%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="3.6"/>
    </filter>
    <filter id="br_ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
  </defs>

  <!-- twin speed-trails behind (south), reads "fastest" -->
  <path d="M28 94 C32 80 36 72 42 66 L46 70 C42 80 40 86 38 94 Z"
        fill="url(#br_trail)" filter="url(#br_motion)" opacity="0.7"/>
  <path d="M68 94 C64 80 60 72 54 66 L50 70 C54 80 56 86 58 94 Z"
        fill="url(#br_trail)" filter="url(#br_motion)" opacity="0.7"/>

  <!-- ground shadow (long, streaked by speed) -->
  <ellipse cx="48" cy="84" rx="28" ry="7.5" fill="#06070A" opacity="0.5"/>
  <ellipse cx="48" cy="85" rx="18" ry="4.5" fill="#06070A" opacity="0.42"/>

  <!-- ================= DIRE-WOLF MOUNT (low, lunging north) ================= -->
  <!-- haunches (south/behind) -->
  <ellipse cx="48" cy="68" rx="22" ry="18" fill="url(#br_fur)" stroke="#0A0B0F" stroke-width="3" transform="rotate(0 48 68)"/>
  <path d="M28 68 C28 80 36 86 48 86 C60 86 68 80 68 68
           C68 76 58 80 48 80 C38 80 28 76 28 68 Z"
        fill="#06070A" opacity="0.5" filter="url(#br_ao)"/>
  <!-- rear legs splayed forward (running) -->
  <path d="M30 76 C24 80 22 86 26 90" fill="none" stroke="#1A1C22" stroke-width="5" stroke-linecap="round"/>
  <path d="M66 76 C72 80 74 86 70 90" fill="none" stroke="#1A1C22" stroke-width="5" stroke-linecap="round"/>

  <!-- forequarters / neck reaching north -->
  <path d="M40 56 C40 44 44 34 48 34 C52 34 56 44 56 56 Z"
        fill="url(#br_fur)" stroke="#0A0B0F" stroke-width="3" stroke-linejoin="round"/>
  <!-- front legs reaching forward -->
  <path d="M40 50 C34 46 30 40 32 34" fill="none" stroke="#1A1C22" stroke-width="5" stroke-linecap="round"/>
  <path d="M56 50 C62 46 66 40 64 34" fill="none" stroke="#1A1C22" stroke-width="5" stroke-linecap="round"/>

  <!-- WOLF HEAD (snarling, north) -->
  <path d="M48 18 C55 18 59 26 59 34 C59 40 54 44 48 44 C42 44 37 40 37 34 C37 26 41 18 48 18 Z"
        fill="url(#br_fur)" stroke="#0A0B0F" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- pricked ears -->
  <path d="M40 22 L36 12 L45 20 Z" fill="url(#br_fur)" stroke="#0A0B0F" stroke-width="2"/>
  <path d="M56 22 L60 12 L51 20 Z" fill="url(#br_fur)" stroke="#0A0B0F" stroke-width="2"/>
  <!-- snout + fangs (north tip) -->
  <path d="M44 18 L48 10 L52 18 Z" fill="url(#br_fur)" stroke="#0A0B0F" stroke-width="2"/>
  <g fill="url(#br_bone)" stroke="#5A5848" stroke-width="0.7">
    <path d="M45 18 L44 13 L47 18 Z"/>
    <path d="M51 18 L52 13 L49 18 Z"/>
  </g>
  <!-- beast ember eyes -->
  <circle cx="44" cy="30" r="3.4" fill="#FF7A2E" opacity="0.7" filter="url(#br_ember_glow)"/>
  <circle cx="52" cy="30" r="3.4" fill="#FF7A2E" opacity="0.7" filter="url(#br_ember_glow)"/>
  <circle cx="44" cy="30" r="1.6" fill="url(#br_ember)"/>
  <circle cx="52" cy="30" r="1.6" fill="url(#br_ember)"/>

  <!-- ================= CLOAKED HONK (sat over the wolf's back) ================= -->
  <!-- billowing cloak streaming south -->
  <path d="M34 60 C30 74 38 84 48 86 C58 84 66 74 62 60
           C58 66 38 66 34 60 Z"
        fill="url(#br_cloak)" stroke="#0A0B0F" stroke-width="2.6" stroke-linejoin="round"/>
  <g stroke="#160A08" stroke-width="1.8" opacity="0.6" stroke-linecap="round">
    <path d="M40 66 C39 74 41 80 40 86"/>
    <path d="M56 66 C57 74 55 80 56 86"/>
  </g>
  <!-- hunched cloaked torso/shoulders -->
  <ellipse cx="48" cy="54" rx="14" ry="12" fill="url(#br_cloak)" stroke="#0A0B0F" stroke-width="2.8"/>
  <ellipse cx="48" cy="59" rx="11" ry="5" fill="#06070A" opacity="0.45" filter="url(#br_ao)"/>

  <!-- hood (deep shadow, no face — a void with a glint) -->
  <ellipse cx="48" cy="50" rx="8" ry="8" fill="#160A08" stroke="#0A0B0F" stroke-width="2.4"/>
  <ellipse cx="48" cy="51" rx="5" ry="5.5" fill="#06070A"/>
  <circle cx="46" cy="50" r="1.1" fill="#FF7A2E" opacity="0.8" filter="url(#br_ember_glow)"/>
  <circle cx="50" cy="50" r="1.1" fill="#FF7A2E" opacity="0.8" filter="url(#br_ember_glow)"/>

  <!-- ================= RAISED BLADE (right hand, swept toward north) ================= -->
  <path d="M64 24 L68 22 L60 50 L56 52 Z"
        fill="url(#br_blade)" stroke="#0E1117" stroke-width="2" stroke-linejoin="round"/>
  <path d="M65 26 L58 49" fill="none" stroke="#E6F0F7" stroke-width="1.1" opacity="0.7" stroke-linecap="round"/>
  <rect x="56" y="50" width="7" height="7" rx="2" fill="#2A1810" stroke="#0E1117" stroke-width="1.6" transform="rotate(-22 59 53)"/>

  <!-- warm rim on lit cloak shoulder -->
  <path d="M36 50 C38 42 44 40 48 40" fill="none" stroke="#7A3A30" stroke-width="1.7" opacity="0.5" stroke-linecap="round"/>
</svg>
