<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - GRIMDARK ENEMY "Fel-Orc Peon" (scrawny weak swarm chaff) -->
  <!-- High 3/4 top-down. Facing UP (north, -Y). No baked rotation. Centered, ~8% margin. -->
  <!-- Same fel-orc family as the Grunt but smaller, slighter, more ragged & malnourished. -->
  <!-- Painterly: gradient lit/shadow flesh, AO seams, rim catch, crisp dark rim, ember eyes. -->
  <defs>
    <radialGradient id="pe_flesh" cx="42%" cy="30%" r="88%">
      <stop offset="0%"  stop-color="#8A9468"/>
      <stop offset="48%" stop-color="#5C6B4A"/>
      <stop offset="100%" stop-color="#222A1A"/>
    </radialGradient>
    <radialGradient id="pe_back" cx="50%" cy="34%" r="82%">
      <stop offset="0%"  stop-color="#6E7B52"/>
      <stop offset="60%" stop-color="#3D472D"/>
      <stop offset="100%" stop-color="#181E10"/>
    </radialGradient>
    <linearGradient id="pe_bone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#E6E0CC"/>
      <stop offset="50%" stop-color="#C9C1A8"/>
      <stop offset="100%" stop-color="#74705C"/>
    </linearGradient>
    <!-- crude wooden club / sharpened stake -->
    <linearGradient id="pe_wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#6B4A2A"/>
      <stop offset="55%" stop-color="#3E2A16"/>
      <stop offset="100%" stop-color="#150D06"/>
    </linearGradient>
    <radialGradient id="pe_ember" cx="50%" cy="45%" r="60%">
      <stop offset="0%"  stop-color="#FFE7B0"/>
      <stop offset="35%" stop-color="#FF7A2E"/>
      <stop offset="100%" stop-color="#5A1D06"/>
    </radialGradient>
    <filter id="pe_ember_glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="pe_ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- ground shadow (small, scrawny) -->
  <ellipse cx="48" cy="83" rx="22" ry="7" fill="#06070A" opacity="0.55"/>
  <ellipse cx="48" cy="84" rx="14" ry="4" fill="#06070A" opacity="0.45"/>

  <!-- ================= CRUDE STAKE / CLUB (raised right fist, toward north) ================= -->
  <path d="M66 30 L71 30 L70 62 L65 62 Z" fill="#06070A" opacity="0.4" filter="url(#pe_ao)"/>
  <path d="M62 60 L61 34 L64 18 L68 34 L67 60 Z"
        fill="url(#pe_wood)" stroke="#0E1117" stroke-width="2" stroke-linejoin="round"/>
  <!-- lashed-on bone shard at the tip -->
  <path d="M64 24 L62 14 L69 22 Z" fill="url(#pe_bone)" stroke="#5A5848" stroke-width="1"/>
  <path d="M63 36 L65 50" fill="none" stroke="#8A7048" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <rect x="61" y="58" width="8" height="9" rx="2" fill="#3D472D" stroke="#0E1117" stroke-width="1.8"/>

  <!-- ================= SLIGHT HUNCHED BODY (narrow, ragged) ================= -->
  <path d="M48 76
           C31 76 25 65 25 53
           C25 41 35 35 48 35
           C61 35 71 41 71 53
           C71 65 65 76 48 76 Z"
        fill="url(#pe_back)" stroke="#0A0B0F" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M25 53 C25 65 31 76 48 76 C65 76 71 65 71 53
           C71 61 60 67 48 67 C36 67 25 61 25 53 Z"
        fill="#06070A" opacity="0.5" filter="url(#pe_ao)"/>

  <!-- bony narrow shoulders (small) -->
  <ellipse cx="35" cy="52" rx="11" ry="13" fill="url(#pe_flesh)" stroke="#0A0B0F" stroke-width="2.8"/>
  <ellipse cx="61" cy="52" rx="11" ry="13" fill="url(#pe_flesh)" stroke="#0A0B0F" stroke-width="2.8"/>
  <ellipse cx="41" cy="55" rx="5" ry="9" fill="#06070A" opacity="0.4" filter="url(#pe_ao)"/>
  <ellipse cx="55" cy="55" rx="5" ry="9" fill="#06070A" opacity="0.4" filter="url(#pe_ao)"/>
  <!-- exposed ribs (malnourished) -->
  <g stroke="#181E10" stroke-width="1.4" opacity="0.55" stroke-linecap="round">
    <path d="M40 63 C44 65 52 65 56 63"/>
    <path d="M41 68 C45 70 51 70 55 68"/>
  </g>

  <!-- ragged loincloth scrap -->
  <path d="M40 73 L44 70 L48 73 L52 70 L56 73 L54 79 L42 79 Z"
        fill="#3E2A16" stroke="#0E1117" stroke-width="1.4" opacity="0.85"/>

  <!-- ================= HEAD (center, forward = north) — gaunt ================= -->
  <path d="M48 42
           C58 42 64 50 64 60
           C64 70 57 76 48 76
           C39 76 32 70 32 60
           C32 50 38 42 48 42 Z"
        fill="url(#pe_flesh)" stroke="#0A0B0F" stroke-width="2.8" stroke-linejoin="round"/>
  <ellipse cx="48" cy="56" rx="13" ry="5" fill="#06070A" opacity="0.45" filter="url(#pe_ao)"/>
  <!-- weak thin brow -->
  <path d="M37 53 C42 46 54 46 59 53 C54 49 42 49 37 53 Z"
        fill="url(#pe_bone)" stroke="#5A5848" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- ember eyes (small, dim) -->
  <g>
    <circle cx="43" cy="58" r="4.2" fill="#FF7A2E" opacity="0.6" filter="url(#pe_ember_glow)"/>
    <circle cx="53" cy="58" r="4.2" fill="#FF7A2E" opacity="0.6" filter="url(#pe_ember_glow)"/>
    <ellipse cx="43" cy="58" rx="3.4" ry="3" fill="#0A0B0F"/>
    <ellipse cx="53" cy="58" rx="3.4" ry="3" fill="#0A0B0F"/>
    <circle cx="43" cy="58" r="1.8" fill="url(#pe_ember)"/>
    <circle cx="53" cy="58" r="1.8" fill="url(#pe_ember)"/>
    <circle cx="42.4" cy="57.4" r="0.7" fill="#FFE7B0"/>
    <circle cx="52.4" cy="57.4" r="0.7" fill="#FFE7B0"/>
  </g>

  <!-- snarling small maw + single tusk (chipped, weak) -->
  <path d="M42 66 C46 64 50 64 54 66 C51 73 45 73 42 66 Z"
        fill="#350C0B" stroke="#0A0B0F" stroke-width="1.4"/>
  <g stroke="#5A5848" stroke-width="0.8" stroke-linejoin="round">
    <path d="M43 67 L40 60 L46 66 Z" fill="url(#pe_bone)"/>
  </g>

  <!-- single warm rim on lit cheek -->
  <path d="M34 56 C36 49 41 45 47 45" fill="none" stroke="#8A9468" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>
</svg>
