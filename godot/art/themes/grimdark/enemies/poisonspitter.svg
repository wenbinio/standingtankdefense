<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - GRIMDARK ENEMY "Croak" (ranged venom beast) -->
  <!-- High 3/4 top-down. Facing UP (north, -Y). No baked rotation. Centered, ~8% margin. -->
  <!-- BREATHER SET (matched form, 3 elements): bloated toad/maw beast spitting from front maw. -->
  <!-- Element = POISON: sickly green venom glow, dripping bile, pustules. -->
  <defs>
    <!-- bloated venom-toad flesh volume -->
    <radialGradient id="ps_flesh" cx="44%" cy="26%" r="90%">
      <stop offset="0%"  stop-color="#7B8A48"/>
      <stop offset="50%" stop-color="#46562A"/>
      <stop offset="100%" stop-color="#161E0C"/>
    </radialGradient>
    <radialGradient id="ps_back" cx="50%" cy="34%" r="84%">
      <stop offset="0%"  stop-color="#56682E"/>
      <stop offset="60%" stop-color="#2E3A18"/>
      <stop offset="100%" stop-color="#0E140A"/>
    </radialGradient>
    <!-- venom maw / spit core (element glow) -->
    <radialGradient id="ps_venom" cx="50%" cy="42%" r="64%">
      <stop offset="0%"  stop-color="#EBFFB0"/>
      <stop offset="35%" stop-color="#9BE83A"/>
      <stop offset="75%" stop-color="#3E7A14"/>
      <stop offset="100%" stop-color="#0E2A06"/>
    </radialGradient>
    <linearGradient id="ps_bone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#E6E0CC"/>
      <stop offset="50%" stop-color="#C9C1A8"/>
      <stop offset="100%" stop-color="#74705C"/>
    </linearGradient>
    <filter id="ps_glow" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="ps_ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- ground shadow under the squat bulk -->
  <ellipse cx="48" cy="84" rx="32" ry="8.5" fill="#06070A" opacity="0.58"/>
  <ellipse cx="48" cy="85" rx="21" ry="5" fill="#06070A" opacity="0.46"/>

  <!-- ================= SPLAYED STUBBY LEGS (4, flank corners) ================= -->
  <g fill="url(#ps_back)" stroke="#0A0B0F" stroke-width="2.6" stroke-linejoin="round">
    <ellipse cx="24" cy="44" rx="9" ry="6" transform="rotate(-30 24 44)"/>
    <ellipse cx="72" cy="44" rx="9" ry="6" transform="rotate(30 72 44)"/>
    <ellipse cx="22" cy="74" rx="9" ry="6" transform="rotate(30 22 74)"/>
    <ellipse cx="74" cy="74" rx="9" ry="6" transform="rotate(-30 74 74)"/>
  </g>

  <!-- ================= BLOATED BODY / WARTY BACK (away/south) ================= -->
  <path d="M48 84
           C26 84 18 70 18 54
           C18 38 30 30 48 30
           C66 30 78 38 78 54
           C78 70 70 84 48 84 Z"
        fill="url(#ps_back)" stroke="#0A0B0F" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M18 54 C18 70 26 84 48 84 C70 84 78 70 78 54
           C78 66 66 72 48 72 C30 72 18 66 18 54 Z"
        fill="#06070A" opacity="0.5" filter="url(#ps_ao)"/>

  <!-- pulsing venom pustules across the back (element read) -->
  <g>
    <circle cx="34" cy="62" r="5.5" fill="#9BE83A" opacity="0.5" filter="url(#ps_glow)"/>
    <circle cx="62" cy="60" r="5" fill="#9BE83A" opacity="0.5" filter="url(#ps_glow)"/>
    <circle cx="48" cy="70" r="4.5" fill="#9BE83A" opacity="0.45" filter="url(#ps_glow)"/>
    <circle cx="34" cy="62" r="2.6" fill="url(#ps_venom)"/>
    <circle cx="62" cy="60" r="2.3" fill="url(#ps_venom)"/>
    <circle cx="48" cy="70" r="2.1" fill="url(#ps_venom)"/>
  </g>
  <!-- warty bumps (dark) -->
  <g fill="#161E0C" opacity="0.6">
    <circle cx="40" cy="55" r="2"/><circle cx="56" cy="66" r="2.2"/><circle cx="28" cy="60" r="1.8"/>
  </g>
  <!-- cool-warm rim on lit back -->
  <path d="M24 50 C28 38 40 34 50 36" fill="none" stroke="#7B8A48" stroke-width="2.4" opacity="0.5" stroke-linecap="round"/>

  <!-- ================= HEAD / GAPING VENOM MAW (front, north) ================= -->
  <path d="M48 26
           C60 26 66 36 66 46
           C66 56 58 62 48 62
           C38 62 30 56 30 46
           C30 36 36 26 48 26 Z"
        fill="url(#ps_flesh)" stroke="#0A0B0F" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- the spitting maw (wide open, aimed north) -->
  <circle cx="48" cy="34" r="16" fill="#9BE83A" opacity="0.5" filter="url(#ps_glow)"/>
  <path d="M36 38 C40 24 56 24 60 38 C56 46 40 46 36 38 Z"
        fill="#0E2A06" stroke="#0A0B0F" stroke-width="2.4"/>
  <path d="M40 36 C44 28 52 28 56 36 C52 41 44 41 40 36 Z"
        fill="url(#ps_venom)"/>
  <!-- maw fang ring -->
  <g fill="url(#ps_bone)" stroke="#5A5848" stroke-width="0.7">
    <path d="M42 30 L44 24 L47 30 Z"/>
    <path d="M49 30 L52 24 L54 30 Z"/>
    <path d="M40 38 L43 44 L46 38 Z"/>
    <path d="M50 38 L53 44 L56 38 Z"/>
  </g>
  <circle cx="46" cy="33" r="1.4" fill="#EBFFB0"/>

  <!-- dripping venom (bile strings off the maw, downward) -->
  <g fill="none" stroke="#9BE83A" stroke-linecap="round" opacity="0.8">
    <path d="M40 44 C39 50 41 54 40 58" stroke-width="2"/>
    <path d="M56 44 C57 50 55 55 56 59" stroke-width="1.8"/>
  </g>
  <circle cx="40" cy="59" r="1.6" fill="#9BE83A" filter="url(#ps_glow)"/>
  <circle cx="56" cy="60" r="1.5" fill="#9BE83A" filter="url(#ps_glow)"/>

  <!-- small beady venom eyes either side of the maw -->
  <circle cx="34" cy="44" r="3" fill="#9BE83A" opacity="0.7" filter="url(#ps_glow)"/>
  <circle cx="62" cy="44" r="3" fill="#9BE83A" opacity="0.7" filter="url(#ps_glow)"/>
  <circle cx="34" cy="44" r="1.4" fill="#0E2A06"/>
  <circle cx="62" cy="44" r="1.4" fill="#0E2A06"/>
</svg>
