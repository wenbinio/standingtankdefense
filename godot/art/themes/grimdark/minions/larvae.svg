<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - GRIMDARK MINION "Larva" (ally, from Squirm) -->
  <!-- High 3/4 top-down. Facing UP (north, -Y). No baked rotation. Centered, ~8% margin. -->
  <!-- Painterly: gradient lit/shadow bone volume, AO seams, crisp dark silhouette. -->
  <!-- ALLY read: COLD CYAN necromantic glow in eye-sockets + chest core (player's cool tell). -->
  <defs>
    <!-- bone volume (cool key from upper-front) -->
    <radialGradient id="sk_bone" cx="44%" cy="28%" r="86%">
      <stop offset="0%"  stop-color="#E6E2D2"/>
      <stop offset="50%" stop-color="#B6B099"/>
      <stop offset="100%" stop-color="#4C4A40"/>
    </radialGradient>
    <!-- ribcage / darker recessed bone -->
    <radialGradient id="sk_rib" cx="50%" cy="32%" r="82%">
      <stop offset="0%"  stop-color="#C9C3AC"/>
      <stop offset="58%" stop-color="#8C8770"/>
      <stop offset="100%" stop-color="#33322A"/>
    </radialGradient>
    <!-- tattered cloth scraps -->
    <linearGradient id="sk_rag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#4A4438"/>
      <stop offset="55%" stop-color="#2E2A22"/>
      <stop offset="100%" stop-color="#121009"/>
    </linearGradient>
    <!-- cold necromantic core (ally cyan) -->
    <radialGradient id="sk_core" cx="50%" cy="42%" r="62%">
      <stop offset="0%"  stop-color="#D7F4FB"/>
      <stop offset="35%" stop-color="#5BC8E6"/>
      <stop offset="100%" stop-color="#0E4756"/>
    </radialGradient>
    <filter id="sk_glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="sk_ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- ground shadow under pivot -->
  <ellipse cx="48" cy="83" rx="26" ry="8" fill="#06070A" opacity="0.55"/>
  <ellipse cx="48" cy="84" rx="17" ry="5" fill="#06070A" opacity="0.45"/>

  <!-- ================= RAISED BONE BLADE (in right fist, toward north) ================= -->
  <!-- cast shadow of blade -->
  <path d="M68 20 L74 20 L72 58 L67 58 Z" fill="#06070A" opacity="0.4" filter="url(#sk_ao)"/>
  <!-- jagged shard-bone blade -->
  <path d="M64 56 L62 22 L68 8 L74 22 L72 56 Z"
        fill="url(#sk_bone)" stroke="#0A0B0F" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- crack groove in blade -->
  <path d="M68 16 L66 30 L69 42" fill="none" stroke="#4C4A40" stroke-width="1.3" opacity="0.7" stroke-linecap="round"/>
  <!-- rim catch on lit blade edge -->
  <path d="M65 22 L63 52" fill="none" stroke="#E6E2D2" stroke-width="1.4" opacity="0.7" stroke-linecap="round"/>
  <!-- bone-grip wrap -->
  <rect x="63" y="56" width="9" height="9" rx="2" fill="#33322A" stroke="#0A0B0F" stroke-width="2"/>

  <!-- ================= TATTERED CLOTH SCRAPS hanging off torso (lower/away) ================= -->
  <path d="M30 64 L26 84 L34 80 L36 66 Z" fill="url(#sk_rag)" stroke="#0A0B0F" stroke-width="2" stroke-linejoin="round"/>
  <path d="M62 64 L66 84 L58 80 L56 66 Z" fill="url(#sk_rag)" stroke="#0A0B0F" stroke-width="2" stroke-linejoin="round"/>

  <!-- ================= BONY SHOULDER KNOBS (to either side) ================= -->
  <ellipse cx="30" cy="48" rx="11" ry="12" fill="url(#sk_bone)" stroke="#0A0B0F" stroke-width="3"/>
  <ellipse cx="66" cy="48" rx="11" ry="12" fill="url(#sk_bone)" stroke="#0A0B0F" stroke-width="3"/>
  <!-- AO seam where shoulders meet torso -->
  <ellipse cx="40" cy="52" rx="5" ry="9" fill="#06070A" opacity="0.4" filter="url(#sk_ao)"/>
  <ellipse cx="56" cy="52" rx="5" ry="9" fill="#06070A" opacity="0.4" filter="url(#sk_ao)"/>
  <!-- jagged bone spurs from left shoulder -->
  <g stroke="#4C4A40" stroke-width="1.2" stroke-linejoin="round">
    <path d="M22 40 L16 28 L26 38 Z" fill="url(#sk_bone)"/>
  </g>

  <!-- ================= RIBCAGE TORSO (center) ================= -->
  <path d="M48 46
           C58 46 62 54 62 64
           C62 74 56 80 48 80
           C40 80 34 74 34 64
           C34 54 38 46 48 46 Z"
        fill="url(#sk_rib)" stroke="#0A0B0F" stroke-width="3" stroke-linejoin="round"/>
  <!-- spine + rib slats (AO grooves) -->
  <g stroke="#06070A" stroke-width="1.6" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M40 60 C45 58 51 58 56 60"/>
    <path d="M39 67 C44 65 52 65 57 67"/>
    <path d="M40 74 C45 72 51 72 56 74"/>
  </g>

  <!-- ================= COLD NECROMANTIC CHEST CORE (ally cyan read) ================= -->
  <circle cx="48" cy="63" r="9" fill="#5BC8E6" opacity="0.55" filter="url(#sk_glow)"/>
  <circle cx="48" cy="63" r="6.4" fill="#0A0B0F" stroke="#5BC8E6" stroke-width="1.4" opacity="0.9"/>
  <circle cx="48" cy="63" r="4.2" fill="url(#sk_core)"/>
  <circle cx="46.5" cy="61.5" r="1.3" fill="#D7F4FB"/>

  <!-- ================= SKULL (forward = north) ================= -->
  <path d="M48 22
           C58 22 64 30 64 40
           C64 50 58 56 48 56
           C38 56 32 50 32 40
           C32 30 38 22 48 22 Z"
        fill="url(#sk_bone)" stroke="#0A0B0F" stroke-width="3" stroke-linejoin="round"/>
  <!-- AO under brow ridge -->
  <ellipse cx="48" cy="36" rx="13" ry="4.5" fill="#06070A" opacity="0.4" filter="url(#sk_ao)"/>
  <!-- cracked-bone brow ridge -->
  <path d="M35 33 C40 27 56 27 61 33 C56 30 40 30 35 33 Z"
        fill="#C9C3AC" stroke="#4C4A40" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- ================= COLD CYAN EYE-SOCKETS (ally glow read) ================= -->
  <g>
    <circle cx="42" cy="38" r="5.2" fill="#5BC8E6" opacity="0.7" filter="url(#sk_glow)"/>
    <circle cx="54" cy="38" r="5.2" fill="#5BC8E6" opacity="0.7" filter="url(#sk_glow)"/>
    <ellipse cx="42" cy="38" rx="3.8" ry="3.4" fill="#0A0B0F"/>
    <ellipse cx="54" cy="38" rx="3.8" ry="3.4" fill="#0A0B0F"/>
    <circle cx="42" cy="38" r="2.2" fill="url(#sk_core)"/>
    <circle cx="54" cy="38" r="2.2" fill="url(#sk_core)"/>
    <circle cx="41" cy="37" r="0.8" fill="#D7F4FB"/>
    <circle cx="53" cy="37" r="0.8" fill="#D7F4FB"/>
  </g>

  <!-- ================= FANGED JAW (lower skull) ================= -->
  <path d="M40 47 C44 45 52 45 56 47 C53 55 43 55 40 47 Z"
        fill="#1A1812" stroke="#0A0B0F" stroke-width="1.6"/>
  <!-- bone teeth slats -->
  <g stroke="#0A0B0F" stroke-width="0.8" opacity="0.8">
    <line x1="44" y1="47" x2="44" y2="52"/>
    <line x1="48" y1="47" x2="48" y2="53"/>
    <line x1="52" y1="47" x2="52" y2="52"/>
  </g>

  <!-- rim catch on lit forward skull edge -->
  <path d="M34 38 C36 30 41 26 47 26" fill="none" stroke="#E6E2D2" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
</svg>
