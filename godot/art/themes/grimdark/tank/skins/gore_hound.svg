<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Standing Tank Defense - SKIN "Gore Hound" -->
  <!-- High 3/4 top-down. Snarling jaws/muzzle point UP (north, -Y). No baked rotation. -->
  <!-- Blood-crazed beast-cannon: spiky war-mutt fused to a cannon, gore-red + bone-white, red eye. -->
  <defs>
    <radialGradient id="gh_body" cx="42%" cy="30%" r="86%">
      <stop offset="0%"  stop-color="#A53A3A"/>
      <stop offset="45%" stop-color="#6E1818"/>
      <stop offset="100%" stop-color="#260606"/>
    </radialGradient>
    <linearGradient id="gh_muzzle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#2A0606"/>
      <stop offset="34%" stop-color="#9A3030"/>
      <stop offset="58%" stop-color="#5E1414"/>
      <stop offset="100%" stop-color="#1A0404"/>
    </linearGradient>
    <radialGradient id="gh_bone" cx="40%" cy="28%" r="85%">
      <stop offset="0%"  stop-color="#FFFBEE"/>
      <stop offset="55%" stop-color="#DCCFB0"/>
      <stop offset="100%" stop-color="#8E7E5E"/>
    </radialGradient>
    <radialGradient id="gh_core" cx="50%" cy="40%" r="62%">
      <stop offset="0%"  stop-color="#FFE3C8"/>
      <stop offset="38%" stop-color="#FF3A2A"/>
      <stop offset="100%" stop-color="#5A0404"/>
    </radialGradient>
    <linearGradient id="gh_blood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#C81818"/>
      <stop offset="100%" stop-color="#6A0606"/>
    </linearGradient>
    <filter id="gh_glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="gh_ao" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="96" cy="166" rx="62" ry="16" fill="#0A0202" opacity="0.55"/>
  <ellipse cx="96" cy="166" rx="40" ry="10" fill="#0A0202" opacity="0.45"/>

  <!-- blood spatter on the floor -->
  <g fill="#7A0808" opacity="0.6">
    <ellipse cx="48" cy="158" rx="8" ry="3.5"/>
    <circle cx="40" cy="150" r="2.6"/>
    <circle cx="58" cy="164" r="2"/>
    <ellipse cx="148" cy="156" rx="7" ry="3"/>
    <circle cx="156" cy="148" r="2.4"/>
  </g>

  <!-- ================= BACK / SHOULDER BONE SPIKES ================= -->
  <g fill="url(#gh_bone)" stroke="#3E3422" stroke-width="2.5" stroke-linejoin="round">
    <path d="M46 116 L34 96 L56 110 Z"/>
    <path d="M146 116 L158 96 L136 110 Z"/>
    <path d="M58 150 L50 134 L70 146 Z"/>
    <path d="M134 150 L142 134 L122 146 Z"/>
  </g>

  <!-- ================= SNARLING UPWARD MUZZLE = BARREL (faces UP) ================= -->
  <!-- gore glow above the maw -->
  <ellipse cx="96" cy="20" rx="14" ry="14" fill="#FF2A1A" opacity="0.4" filter="url(#gh_glow)"/>
  <!-- muzzle/snout barrel -->
  <path d="M76 88 L72 30 Q96 18 120 30 L116 88 Z" fill="url(#gh_muzzle)" stroke="#180404" stroke-width="4" stroke-linejoin="round"/>
  <!-- muzzle lit edge -->
  <path d="M79 84 L76 34" stroke="#C84A4A" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <!-- nostrils -->
  <ellipse cx="88" cy="38" rx="3" ry="4.5" fill="#160404"/>
  <ellipse cx="104" cy="38" rx="3" ry="4.5" fill="#160404"/>
  <!-- the dark maw bore -->
  <ellipse cx="96" cy="28" rx="18" ry="8" fill="#120202"/>
  <ellipse cx="96" cy="28" rx="11" ry="4.5" fill="#2A0606"/>
  <!-- JAGGED FANG TEETH around the maw rim -->
  <g fill="url(#gh_bone)" stroke="#3E3422" stroke-width="1.6" stroke-linejoin="round">
    <path d="M80 24 L84 34 L88 25 Z"/>
    <path d="M90 23 L94 35 L98 23 Z"/>
    <path d="M100 23 L104 35 L108 24 Z"/>
    <path d="M110 25 L113 33 L116 25 Z"/>
    <path d="M82 32 L86 23 L90 32 Z"/>
    <path d="M102 32 L106 23 L110 32 Z"/>
  </g>
  <!-- blood dripping from the maw -->
  <g fill="url(#gh_blood)" stroke="#3E0404" stroke-width="1">
    <path d="M84 33 C82 42 80 46 84 47 C88 46 86 42 86 33 Z"/>
    <path d="M104 34 C103 46 100 54 104 56 C108 54 106 46 106 34 Z"/>
    <circle cx="104" cy="60" r="2.6"/>
  </g>

  <!-- ================= HULKING BEAST BODY ================= -->
  <ellipse cx="96" cy="142" rx="54" ry="14" fill="#0A0202" opacity="0.4" filter="url(#gh_ao)"/>
  <path d="M96 76
           C142 74 158 98 156 124
           C154 152 126 160 96 160
           C66 160 38 152 36 124
           C34 98 50 78 96 76 Z"
        fill="url(#gh_body)" stroke="#180404" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- deep AO lower-right -->
  <path d="M156 124 C154 152 126 160 96 160 C124 154 146 142 148 118 Z"
        fill="#0A0202" opacity="0.5" filter="url(#gh_ao)"/>
  <!-- rim light upper-left -->
  <path d="M96 76 C64 76 46 92 40 116 C52 92 70 80 96 80 Z" fill="#D86060" opacity="0.5"/>
  <!-- muscle / scar grooves -->
  <path d="M58 104 Q76 116 70 138" stroke="#2A0606" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M134 102 Q118 116 124 138" stroke="#2A0606" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>
  <!-- claw-mark scars -->
  <g stroke="#FFE0D8" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <path d="M104 130 L118 150"/>
    <path d="M110 128 L124 148"/>
    <path d="M116 126 L130 146"/>
  </g>
  <!-- blood spatter on body -->
  <g fill="#3A0606" opacity="0.6">
    <circle cx="72" cy="118" r="4"/>
    <circle cx="64" cy="128" r="2.4"/>
    <circle cx="128" cy="120" r="3"/>
  </g>

  <!-- ridge of bone spikes along the spine -->
  <g fill="url(#gh_bone)" stroke="#3E3422" stroke-width="2" stroke-linejoin="round">
    <path d="M82 80 L86 64 L92 80 Z"/>
    <path d="M100 80 L106 62 L112 80 Z"/>
  </g>

  <!-- ================= FERAL RED GLOWING EYE-CORE (ally read) ================= -->
  <circle cx="96" cy="120" r="23" fill="#FF2A1A" opacity="0.6" filter="url(#gh_glow)"/>
  <circle cx="96" cy="120" r="17" fill="#160202" stroke="#5A0808" stroke-width="3.5"/>
  <circle cx="96" cy="120" r="13" fill="url(#gh_core)"/>
  <!-- slit pupil -->
  <ellipse cx="96" cy="120" rx="3" ry="11" fill="#1A0202"/>
  <circle cx="91" cy="114" r="3.5" fill="#FFE3C8"/>
  <!-- angry bone brow over the eye -->
  <path d="M72 102 Q96 92 120 102 L114 110 Q96 102 78 110 Z" fill="url(#gh_bone)" stroke="#3E3422" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- bone-stud rivets -->
  <g fill="url(#gh_bone)" stroke="#3E3422" stroke-width="1.2">
    <circle cx="52" cy="126" r="3.5"/>
    <circle cx="140" cy="126" r="3.5"/>
    <circle cx="74" cy="146" r="3"/>
    <circle cx="118" cy="146" r="3"/>
  </g>
</svg>
