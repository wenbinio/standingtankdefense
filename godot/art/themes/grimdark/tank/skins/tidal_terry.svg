<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Standing Tank Defense - SKIN "Tidal Terry" -->
  <!-- High 3/4 top-down. Curling wave sprays a sweeping arc of water/foam UP (north, -Y). -->
  <!-- Goofy water-wave creature: teal/aqua, white foam caps, pale cyan watery glow core. Rubber duck gag. -->
  <defs>
    <radialGradient id="tt_wave" cx="40%" cy="30%" r="90%">
      <stop offset="0%"  stop-color="#7FE8F0"/>
      <stop offset="45%" stop-color="#2A9AC4"/>
      <stop offset="100%" stop-color="#0E4A6E"/>
    </radialGradient>
    <linearGradient id="tt_crest" x1="0%" y1="100%" x2="20%" y2="0%">
      <stop offset="0%"  stop-color="#1E7CA8"/>
      <stop offset="55%" stop-color="#4FC2E0"/>
      <stop offset="100%" stop-color="#CFF6FA"/>
    </linearGradient>
    <radialGradient id="tt_core" cx="50%" cy="42%" r="62%">
      <stop offset="0%"  stop-color="#F0FEFF"/>
      <stop offset="40%" stop-color="#8DEBFA"/>
      <stop offset="100%" stop-color="#176C8E"/>
    </radialGradient>
    <linearGradient id="tt_spray" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"  stop-color="#4FC2E0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#BFF0F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="tt_duck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#FFE36B"/>
      <stop offset="60%" stop-color="#FFC020"/>
      <stop offset="100%" stop-color="#C98A0A"/>
    </linearGradient>
    <filter id="tt_glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="tt_ao" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ground shadow (wet puddle) -->
  <ellipse cx="96" cy="168" rx="62" ry="17" fill="#072636" opacity="0.55"/>
  <ellipse cx="96" cy="168" rx="42" ry="11" fill="#072636" opacity="0.45"/>

  <!-- ================= SWEEPING UPWARD WATER ARC (the wave sweep) ================= -->
  <!-- arc of water sweeping up and curling, with foam edge -->
  <path d="M96 110 C70 96 56 64 70 30 C78 16 92 12 104 16 C90 18 80 28 78 46
           C76 70 86 90 110 100 C118 104 128 102 134 96 C128 110 110 118 96 110 Z"
        fill="url(#tt_spray)" stroke="#1E7CA8" stroke-width="3" stroke-linejoin="round" opacity="0.92"/>
  <!-- foam droplets flung along the arc -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="74" cy="34" r="5"/><circle cx="68" cy="46" r="4"/>
    <circle cx="80" cy="22" r="4.5"/><circle cx="98" cy="16" r="4"/>
    <circle cx="112" cy="22" r="3.5"/><circle cx="62" cy="60" r="3.5"/>
    <circle cx="88" cy="14" r="3"/><circle cx="124" cy="92" r="3.5"/>
  </g>

  <!-- ================= CURLING CRESTING WAVE BODY ================= -->
  <ellipse cx="96" cy="138" rx="58" ry="14" fill="#072636" opacity="0.5" filter="url(#tt_ao)"/>
  <!-- main wave hump -->
  <path d="M40 142
           C36 104 56 74 96 74
           C136 74 156 104 152 142
           C148 156 124 162 96 162
           C68 162 44 156 40 142 Z"
        fill="url(#tt_wave)" stroke="#0A3A56" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- AO lower-right -->
  <path d="M152 142 C148 156 124 162 96 162 C68 162 44 156 40 142
           C46 150 70 152 96 152 C122 152 146 150 152 142 Z"
        fill="#072636" opacity="0.5" filter="url(#tt_ao)"/>
  <!-- rim light upper-left -->
  <path d="M96 74 C66 74 48 92 42 116 C52 92 70 84 96 84
           C122 84 140 92 150 116 C144 92 126 74 96 74 Z"
        fill="#9FF0FA" opacity="0.5"/>

  <!-- curling foam crest along the top of the wave -->
  <path d="M44 96 C58 82 76 80 86 90 C96 80 112 80 122 90 C134 80 150 84 150 100
           C140 92 128 94 122 102 C112 92 98 92 90 102 C80 92 64 92 56 104
           C50 96 46 96 44 96 Z"
        fill="#FFFFFF" stroke="#BFE8F0" stroke-width="2" opacity="0.92" stroke-linejoin="round"/>
  <!-- foam bubbles -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="60" cy="92" r="4"/><circle cx="108" cy="90" r="4"/>
    <circle cx="138" cy="94" r="3.5"/><circle cx="80" cy="94" r="3"/>
  </g>

  <!-- ================= GOOFY CARTOON FACE ================= -->
  <!-- big happy eyes -->
  <circle cx="78" cy="118" r="15" fill="#FFFFFF" stroke="#0A3A56" stroke-width="3.5"/>
  <circle cx="116" cy="118" r="15" fill="#FFFFFF" stroke="#0A3A56" stroke-width="3.5"/>
  <circle cx="81" cy="121" r="7" fill="#0E3346"/>
  <circle cx="113" cy="121" r="7" fill="#0E3346"/>
  <circle cx="78" cy="118" r="2.6" fill="#FFFFFF"/>
  <circle cx="110" cy="118" r="2.6" fill="#FFFFFF"/>
  <!-- big open goofy grin -->
  <path d="M74 138 C84 154 108 154 118 138 C108 146 84 146 74 138 Z"
        fill="#0E3346" stroke="#0A3A56" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M82 145 C90 150 102 150 110 145 L110 142 C102 146 90 146 82 142 Z" fill="#FF8AA0"/>

  <!-- ================= RUBBER DUCK gag, riding the crest ================= -->
  <g transform="rotate(-8 134 70)">
    <ellipse cx="134" cy="74" rx="13" ry="10" fill="url(#tt_duck)" stroke="#8A5C06" stroke-width="2.5"/>
    <circle cx="128" cy="62" r="8" fill="url(#tt_duck)" stroke="#8A5C06" stroke-width="2.5"/>
    <path d="M120 60 L110 62 L120 66 Z" fill="#FF8A1E" stroke="#8A5C06" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="126" cy="60" r="1.8" fill="#1A1208"/>
  </g>

  <!-- ================= PALE CYAN WATERY GLOW CORE (ally read) ================= -->
  <!-- core sits low-center on the wave belly -->
  <circle cx="96" cy="128" r="18" fill="#8DEBFA" opacity="0.5" filter="url(#tt_glow)"/>
  <circle cx="96" cy="128" r="12" fill="url(#tt_core)" stroke="#176C8E" stroke-width="2.5"/>
  <circle cx="92" cy="124" r="3.5" fill="#F0FEFF"/>
</svg>
