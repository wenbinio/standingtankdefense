<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Standing Tank Defense - SKIN "Sir Toots-a-Lot" (Gaslamp Bulwark, CHIBI) -->
  <!-- Pompous brass steam-teapot war-machine: fat brass pot body, curvy spout barrel UP, ornate handle, dainty feet, amber gaslight core. -->
  <defs>
    <filter id="st_glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="96" cy="160" rx="58" ry="21" fill="#0b0d14" opacity="0.45"/>

  <!-- dainty clawed feet -->
  <g stroke="#101218" stroke-width="4" stroke-linejoin="round" fill="#3a4a63">
    <path d="M58 150 L50 168 L74 168 L70 150 Z"/>
    <path d="M122 150 L134 168 L110 168 L114 150 Z"/>
  </g>

  <!-- ornate handle loops to the left -->
  <path d="M40 92 C12 92 12 150 42 150" fill="none" stroke="#caa24a" stroke-width="9" stroke-linecap="round"/>
  <path d="M40 92 C18 92 18 150 42 150" fill="none" stroke="#101218" stroke-width="3" opacity="0.5"/>

  <!-- curvy spout barrel UP (graceful S) -->
  <path d="M118 78 C150 70 150 36 120 30 C108 28 100 26 96 14"
        fill="none" stroke="#caa24a" stroke-width="22" stroke-linecap="round"/>
  <path d="M118 78 C150 70 150 36 120 30 C108 28 100 26 96 14"
        fill="none" stroke="#101218" stroke-width="4" opacity="0.4"/>
  <path d="M120 74 C144 68 144 40 122 36" fill="none" stroke="#bcd6f2" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <!-- amber steam puff at spout tip -->
  <circle cx="96" cy="14" r="9" fill="#caa24a" filter="url(#st_glow)"/>
  <circle cx="96" cy="14" r="5" fill="#e8e3d2"/>

  <!-- fat brass teapot body -->
  <path d="M96 56 C142 56 160 86 160 116 C160 150 132 162 96 162
           C60 162 32 150 32 116 C32 86 50 56 96 56 Z"
        fill="#caa24a" stroke="#101218" stroke-width="5" stroke-linejoin="round"/>
  <path d="M160 116 C160 150 132 162 96 162 C60 162 32 150 32 116
           C32 132 64 142 96 142 C128 142 160 132 160 116 Z" fill="#3a4a63" opacity="0.55"/>
  <path d="M96 56 C142 56 160 86 160 116 C146 88 124 76 96 76
           C68 76 46 88 32 116 C32 86 50 56 96 56 Z" fill="#bcd6f2" opacity="0.55"/>
  <!-- ornate engraved band -->
  <path d="M40 100 C64 110 128 110 152 100" fill="none" stroke="#101218" stroke-width="2.5" opacity="0.5"/>
  <g fill="#bcd6f2" opacity="0.7"><circle cx="60" cy="98" r="2.6"/><circle cx="132" cy="98" r="2.6"/><circle cx="96" cy="70" r="2.6"/></g>

  <!-- ornate lid knob on top -->
  <circle cx="96" cy="58" r="9" fill="#3a4a63" stroke="#101218" stroke-width="3.5"/>
  <circle cx="96" cy="58" r="4" fill="#bcd6f2"/>

  <!-- big amber gaslight eye -->
  <circle cx="96" cy="118" r="26" fill="#caa24a" filter="url(#st_glow)"/>
  <circle cx="96" cy="118" r="23" fill="#101218" stroke="#bcd6f2" stroke-width="4.5"/>
  <circle cx="96" cy="118" r="13" fill="#caa24a"/>
  <circle cx="91" cy="112" r="5" fill="#e8e3d2"/>
</svg>
