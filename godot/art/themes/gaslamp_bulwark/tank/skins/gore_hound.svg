<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Standing Tank Defense - SKIN "Gore Hound" (Gaslamp Bulwark, CHIBI) -->
  <!-- Blood-crazed war-mutt cannon: fat beastly body, snarling fanged muzzle UP, stubby bone spikes, hellfire-red eye. -->
  <defs>
    <filter id="gh_glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="96" cy="160" rx="60" ry="22" fill="#0b0d14" opacity="0.45"/>

  <!-- back/shoulder bone spikes (stubby, blunt) -->
  <g fill="#d9d2b0" stroke="#101218" stroke-width="3.5" stroke-linejoin="round">
    <path d="M44 96 L30 78 L52 88 Z"/><path d="M148 96 L162 78 L140 88 Z"/>
    <path d="M62 70 L56 50 L74 64 Z"/><path d="M130 70 L136 50 L118 64 Z"/>
  </g>

  <!-- snarling fanged muzzle/cannon UP -->
  <rect x="78" y="20" width="36" height="56" rx="14" fill="#3a4a63" stroke="#101218" stroke-width="4.5" stroke-linejoin="round"/>
  <rect x="83" y="26" width="8" height="44" rx="4" fill="#6f8db3"/>
  <!-- snarl maw ring with fangs -->
  <rect x="68" y="8" width="56" height="20" rx="9" fill="#1f3322" stroke="#101218" stroke-width="4.5"/>
  <g fill="#d9d2b0" stroke="#101218" stroke-width="1.5">
    <path d="M74 20 L78 32 L82 20 Z"/><path d="M88 22 L92 34 L96 22 Z"/>
    <path d="M100 22 L104 34 L108 22 Z"/><path d="M114 20 L118 32 L110 20 Z"/>
  </g>
  <circle cx="96" cy="16" r="7" fill="#ff5a3c" filter="url(#gh_glow)"/>

  <!-- fat beastly body, leaning forward -->
  <path d="M96 56 C142 56 160 84 158 118 C156 150 130 162 96 162
           C62 162 32 150 34 118 C36 84 50 56 96 56 Z"
        fill="#6f8db3" stroke="#101218" stroke-width="5" stroke-linejoin="round"/>
  <path d="M158 118 C156 150 130 162 96 162 C62 162 32 150 34 118
           C34 134 64 144 96 144 C128 144 158 134 158 118 Z" fill="#3a4a63" opacity="0.9"/>
  <path d="M96 56 C142 56 160 84 158 118 C144 88 124 76 96 76
           C68 76 50 88 34 118 C36 84 50 56 96 56 Z" fill="#bcd6f2" opacity="0.7"/>
  <!-- gore-red scar slashes -->
  <g stroke="#ff5a3c" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M58 100 L72 116"/><path d="M134 98 L120 114"/>
  </g>
  <!-- pinned-back ears (stubby) -->
  <path d="M48 80 C36 70 36 90 50 96 Z" fill="#3a4a63" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M144 80 C156 70 156 90 142 96 Z" fill="#3a4a63" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- big hellfire-red eye -->
  <circle cx="96" cy="116" r="26" fill="#ff5a3c" filter="url(#gh_glow)"/>
  <circle cx="96" cy="116" r="23" fill="#101218" stroke="#caa24a" stroke-width="4.5"/>
  <circle cx="96" cy="116" r="13" fill="#ff5a3c"/>
  <circle cx="91" cy="110" r="5" fill="#d9d2b0"/>
</svg>
