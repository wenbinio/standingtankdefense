<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Standing Tank Defense - SKIN "Bouncy Boi" (Gaslamp Bulwark, CHIBI) -->
  <!-- Rubbery pinball-bumper turret: glossy round body, coil springs, launched ball + ricochet arcs UP (bounce). -->
  <defs>
    <filter id="bb_glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="96" cy="160" rx="60" ry="22" fill="#0b0d14" opacity="0.45"/>

  <!-- ricochet arc marks + launched ball UP -->
  <g stroke="#bcd6f2" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" stroke-dasharray="6 7">
    <path d="M96 60 C70 40 78 24 96 18 C114 24 122 40 96 60"/>
  </g>
  <circle cx="96" cy="16" r="11" fill="#3fa9ff" filter="url(#bb_glow)"/>
  <circle cx="96" cy="16" r="8" fill="#6f8db3" stroke="#101218" stroke-width="3"/>
  <circle cx="93" cy="13" r="3" fill="#bcd6f2"/>

  <!-- coil springs (sides) -->
  <g stroke="#caa24a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M44 150 C30 144 58 140 42 134 C28 128 56 124 44 118"/>
    <path d="M148 150 C162 144 134 140 150 134 C164 128 136 124 148 118"/>
  </g>

  <!-- glossy bumper body -->
  <circle cx="96" cy="108" r="58" fill="#6f8db3" stroke="#101218" stroke-width="5" stroke-linejoin="round"/>
  <path d="M154 108 A58 58 0 0 1 96 166 A58 58 0 0 0 148 80 Z" fill="#3a4a63" opacity="0.85"/>
  <path d="M96 50 A58 58 0 0 0 44 92 A58 58 0 0 1 96 70 A58 58 0 0 1 148 92 A58 58 0 0 0 96 50 Z" fill="#bcd6f2" opacity="0.65"/>
  <!-- concentric bumper rings, brass -->
  <circle cx="96" cy="108" r="46" fill="none" stroke="#caa24a" stroke-width="6"/>
  <circle cx="96" cy="108" r="34" fill="none" stroke="#101218" stroke-width="3" opacity="0.5"/>
  <!-- glossy hot-spot -->
  <ellipse cx="78" cy="84" rx="14" ry="9" fill="#bcd6f2" opacity="0.8"/>

  <!-- big bumper-light core eye -->
  <circle cx="96" cy="108" r="22" fill="#3fa9ff" filter="url(#bb_glow)"/>
  <circle cx="96" cy="108" r="18" fill="#101218" stroke="#caa24a" stroke-width="4.5"/>
  <circle cx="96" cy="108" r="10" fill="#3fa9ff"/>
  <circle cx="91" cy="103" r="4" fill="#bcd6f2"/>
</svg>
