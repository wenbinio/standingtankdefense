<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Standing Tank Defense - SKIN "Franken-Tank" (Gaslamp Bulwark, CHIBI) -->
  <!-- Mad-science mash-up: stitched lopsided body, two mismatched barrels UP, tesla coils w/ arc, rot-green tesla core. -->
  <defs>
    <filter id="ft_glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="96" cy="160" rx="60" ry="22" fill="#0b0d14" opacity="0.45"/>

  <!-- tesla coils (rear bits) with electric arc -->
  <g stroke="#101218" stroke-width="4" stroke-linejoin="round">
    <rect x="34" y="60" width="14" height="40" rx="7" fill="#caa24a"/>
    <rect x="144" y="60" width="14" height="40" rx="7" fill="#caa24a"/>
  </g>
  <circle cx="41" cy="58" r="9" fill="#a6d65e" filter="url(#ft_glow)"/>
  <circle cx="151" cy="58" r="9" fill="#a6d65e" filter="url(#ft_glow)"/>
  <path d="M41 58 L62 48 L52 66 L78 56" fill="none" stroke="#a6d65e" stroke-width="2.5" stroke-linecap="round" filter="url(#ft_glow)"/>
  <path d="M151 58 L130 48 L140 66 L114 56" fill="none" stroke="#a6d65e" stroke-width="2.5" stroke-linecap="round" filter="url(#ft_glow)"/>

  <!-- two mismatched barrels UP -->
  <rect x="64" y="22" width="24" height="52" rx="11" fill="#3a4a63" stroke="#101218" stroke-width="4.5" stroke-linejoin="round"/>
  <rect x="68" y="28" width="6" height="40" rx="3" fill="#6f8db3"/>
  <rect x="104" y="14" width="30" height="60" rx="13" fill="#3a4a63" stroke="#101218" stroke-width="4.5" stroke-linejoin="round"/>
  <rect x="124" y="20" width="6" height="48" rx="3" fill="#6f8db3" opacity="0.6"/>
  <circle cx="76" cy="22" r="6" fill="#a6d65e" filter="url(#ft_glow)"/>
  <circle cx="119" cy="14" r="7" fill="#a6d65e" filter="url(#ft_glow)"/>

  <!-- stitched lopsided body (two mismatched halves) -->
  <path d="M96 56 C140 56 158 86 158 120 C158 150 132 162 96 162
           C58 162 34 148 36 114 C38 84 52 56 96 56 Z"
        fill="#6f8db3" stroke="#101218" stroke-width="5" stroke-linejoin="round"/>
  <!-- right half darker (mismatched flesh) -->
  <path d="M96 56 C140 56 158 86 158 120 C158 150 132 162 96 162 L96 56 Z" fill="#3a4a63" opacity="0.45"/>
  <path d="M158 120 C158 150 132 162 96 162 C58 162 34 148 36 114
           C36 132 64 142 96 142 C128 142 158 134 158 120 Z" fill="#3a4a63" opacity="0.9"/>
  <path d="M96 56 C140 56 158 86 158 120 C144 88 124 76 96 76
           C68 76 50 88 36 114 C38 84 52 56 96 56 Z" fill="#bcd6f2" opacity="0.6"/>
  <!-- big center stitch seam -->
  <path d="M96 58 L96 160" stroke="#101218" stroke-width="3" opacity="0.7"/>
  <g stroke="#101218" stroke-width="2.5" opacity="0.7">
    <path d="M88 70 L104 70"/><path d="M88 88 L104 88"/><path d="M88 130 L104 130"/><path d="M88 148 L104 148"/>
  </g>
  <!-- brain jar on top -->
  <ellipse cx="96" cy="64" rx="16" ry="9" fill="#a6d65e" stroke="#101218" stroke-width="3" opacity="0.85"/>

  <!-- big rot-green tesla eye -->
  <circle cx="96" cy="116" r="26" fill="#a6d65e" filter="url(#ft_glow)"/>
  <circle cx="96" cy="116" r="23" fill="#101218" stroke="#caa24a" stroke-width="4.5"/>
  <circle cx="96" cy="116" r="13" fill="#a6d65e"/>
  <circle cx="91" cy="110" r="5" fill="#e8e3d2"/>
</svg>
