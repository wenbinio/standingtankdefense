<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="58%" stop-color="#efe2c0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a36" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="paper" cx="40%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#f3e8c8"/>
      <stop offset="100%" stop-color="#e4d4ad"/>
    </radialGradient>
    <radialGradient id="puff" cx="40%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#cf8f9c"/>
      <stop offset="100%" stop-color="#a86676"/>
    </radialGradient>
  </defs>

<g stroke-linejoin="round" stroke-linecap="round">

    <!-- ============ FUZZY RIM (ink spikes radiating) ============ -->
    <g fill="#241c14">
      <path d="M160 60 L150 18 L172 22 Z"/>
      <path d="M222 78 L250 44 L256 66 Z"/>
      <path d="M258 134 L300 122 L290 144 Z"/>
      <path d="M258 196 L298 210 L278 222 Z"/>
      <path d="M214 244 L238 280 L216 280 Z"/>
      <path d="M160 262 L168 304 L148 300 Z"/>
      <path d="M104 244 L84 282 L78 260 Z"/>
      <path d="M62 196 L22 212 L34 190 Z"/>
      <path d="M60 134 L20 124 L40 110 Z"/>
      <path d="M100 80 L72 46 L92 42 Z"/>
    </g>

    <!-- ============ INK OUTLINE BODY ============ -->
    <circle cx="160" cy="162" r="104" fill="#241c14"/>

    <!-- ============ PUFFBALL BODY ============ -->
    <circle cx="160" cy="162" r="94" fill="url(#puff)"/>
    <!-- soft fuzzy inner rim (lighter halo) -->
    <circle cx="160" cy="162" r="94" fill="none" stroke="#d9a3b0" stroke-width="7" opacity="0.6"/>
    <!-- top highlight -->
    <path d="M104 116 C124 92 160 84 192 96 C160 96 126 110 110 138 Z" fill="#e0b3bd" opacity="0.7"/>

    <!-- speckle texture (spore dots) -->
    <g fill="#8a4f5e" opacity="0.55">
      <circle cx="200" cy="150" r="5"/><circle cx="118" cy="180" r="4"/>
      <circle cx="190" cy="210" r="4.5"/><circle cx="142" cy="222" r="4"/>
      <circle cx="210" cy="190" r="3.5"/>
    </g>

    <!-- ============ TINY FACE ============ -->
    <!-- pie-cut eyes -->
    <circle cx="134" cy="150" r="17" fill="#f4ecd6"/>
    <circle cx="186" cy="150" r="17" fill="#f4ecd6"/>
    <circle cx="134" cy="150" r="17" fill="none" stroke="#241c14" stroke-width="3"/>
    <circle cx="186" cy="150" r="17" fill="none" stroke="#241c14" stroke-width="3"/>
    <path d="M139 146 L139 165 A13 13 0 0 1 124 153 Z" fill="#241c14"/>
    <path d="M181 146 L181 165 A13 13 0 0 0 196 153 Z" fill="#241c14"/>
    <!-- little brows -->
    <path d="M118 134 C126 128 142 130 150 138" fill="none" stroke="#241c14" stroke-width="4" stroke-linecap="round"/>
    <path d="M170 138 C178 130 194 128 202 134" fill="none" stroke="#241c14" stroke-width="4" stroke-linecap="round"/>
    <!-- small round open mouth -->
    <ellipse cx="160" cy="196" rx="14" ry="11" fill="#241c14"/>
    <ellipse cx="160" cy="200" rx="7" ry="5" fill="#a86676"/>

    <!-- floating motion dust -->
    <g fill="#c79a8e" opacity="0.7">
      <circle cx="276" cy="262" r="4"/><circle cx="290" cy="246" r="2.5"/>
      <circle cx="44" cy="60" r="4"/><circle cx="30" cy="78" r="2.5"/>
    </g>
  </g>

</svg>
