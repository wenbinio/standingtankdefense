<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Standing Tank Defense - PROJECTILE "Siege Boulder" -->
  <!-- Player projectile. Faces UP (north, -Y) - motion smear trails below. -->
  <!-- Steel-dark / steel cracked rock, tiny motion smear. Centered, ~8% margin. -->

  <!-- motion smear (behind, trailing down) -->
  <g fill="#3a4a63" stroke="none">
    <ellipse cx="22" cy="40" rx="3" ry="6" opacity="0.18"/>
    <ellipse cx="28" cy="38" rx="2.4" ry="5" opacity="0.14"/>
  </g>

  <!-- boulder body (lumpy, leading edge up) -->
  <path d="M24 7 L34 12 L39 23 L35 35 L24 40 L12 34 L9 21 L14 11 Z"
        fill="#3a4a63" stroke="#101218" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- inner shadow (lower/away half) -->
  <path d="M39 23 L35 35 L24 40 L12 34 L9 21 L24 24 Z" fill="#0b0d14" opacity="0.4"/>
  <!-- rim light (top/forward edge) -->
  <path d="M24 7 L34 12 L36 17 L24 12 L13 17 L14 11 Z" fill="#6f8db3" opacity="0.85"/>

  <!-- cracks -->
  <g stroke="#101218" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M24 13 L21 22 L26 27 L23 34"/>
    <path d="M21 22 L13 24"/>
    <path d="M26 27 L34 26"/>
  </g>
  <!-- a couple of lit facets -->
  <path d="M16 16 L21 18 L19 23 L14 21 Z" fill="#6f8db3" opacity="0.5"/>
  <path d="M30 18 L34 21 L31 25 L28 22 Z" fill="#6f8db3" opacity="0.35"/>
</svg>
