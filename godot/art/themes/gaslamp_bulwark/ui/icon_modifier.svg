<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="eglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="32" cy="54" rx="16" ry="4" fill="#0b0d14" fill-opacity="0.35"/>

  <!-- Arcane upgrade rune-gem: brass setting cradling an aether crystal, upgrade chevron -->
  <!-- brass octagon setting -->
  <path d="M32 8 L48 16 L48 40 L32 52 L16 40 L16 16 Z"
        fill="#caa24a" stroke="#101218" stroke-width="4" stroke-linejoin="round"/>
  <!-- inner shadow on setting -->
  <path d="M32 52 L48 40 L48 16 L42 20 L42 40 L32 48 Z" fill="#101218" fill-opacity="0.22"/>
  <!-- rim light on setting -->
  <path d="M16 16 L32 8 L48 16" fill="none" stroke="#bcd6f2" stroke-width="2" stroke-linecap="round" stroke-opacity="0.45"/>

  <!-- aether crystal core (glow) -->
  <g filter="url(#eglow)">
    <path d="M32 16 L42 30 L32 44 L22 30 Z" fill="#3fa9ff" stroke="#101218" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- crystal facets -->
  <path d="M32 16 L32 44" stroke="#101218" stroke-width="1.6" stroke-opacity="0.5"/>
  <path d="M22 30 L42 30" stroke="#101218" stroke-width="1.6" stroke-opacity="0.5"/>
  <path d="M32 16 L37 30 L32 44 Z" fill="#bcd6f2" fill-opacity="0.4"/>

  <!-- upgrade chevron (ally-glow, points UP) -->
  <path d="M24 28 L32 20 L40 28" fill="none" stroke="#bcd6f2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
</svg>
