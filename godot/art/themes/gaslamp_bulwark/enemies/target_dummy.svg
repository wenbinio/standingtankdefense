<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="58%" stop-color="#efe2c0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a36" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="paper" cx="40%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#f3e8c8"/>
      <stop offset="100%" stop-color="#e4d4ad"/>
    </radialGradient>
    <radialGradient id="dodo" cx="42%" cy="32%" r="76%">
      <stop offset="0%" stop-color="#a9a193"/>
      <stop offset="100%" stop-color="#867d6c"/>
    </radialGradient>
  </defs>

<g stroke-linejoin="round" stroke-linecap="round">

    <!-- ============ INK UNDERSHAPES ============ -->
    <g fill="#241c14">
      <!-- plump round body blob -->
      <path d="M160 306 C92 306 52 258 52 200 C52 144 96 110 160 110
               C224 110 268 144 268 200 C268 258 228 306 160 306 Z"/>
      <!-- round head sitting on top, slight neck pinch -->
      <path d="M126 130 C92 130 70 104 70 76 C70 46 96 24 132 24
               C168 24 192 46 192 76 C192 104 170 130 136 130 Z"/>
      <!-- big hooked beak off front of face, curving down -->
      <path d="M178 70 C222 60 266 74 274 104 C278 122 270 140 252 156
               C238 168 222 158 224 142 C236 138 240 124 230 112
               C214 100 184 102 176 96 Z"/>
      <!-- tiny useless wing -->
      <path d="M52 198 C24 198 8 216 12 236 C16 252 34 254 44 242
               C38 232 44 218 60 216 Z"/>
    </g>

    <!-- ============ BODY ============ -->
    <path d="M160 298 C98 298 60 254 60 200 C60 150 100 118 160 118
             C220 118 260 150 260 200 C260 254 222 298 160 298 Z" fill="url(#dodo)"/>
    <!-- pale belly -->
    <path d="M160 292 C112 292 84 258 84 214 C84 194 114 190 160 190
             C206 190 230 196 230 218 C230 260 204 292 160 292 Z" fill="#d8d2c2"/>

    <!-- ============ HEAD ============ -->
    <path d="M126 124 C94 124 78 100 78 76 C78 48 102 30 132 30
             C162 30 184 48 184 76 C184 100 162 124 130 124 Z" fill="#a9a193"/>

    <!-- ============ BEAK ============ -->
    <path d="M180 76 C220 66 260 80 267 106 C271 122 263 138 247 152
             C235 162 222 154 224 140 C236 136 240 122 229 110
             C214 98 188 100 178 96 Z" fill="#c9a049"/>
    <!-- mouth seam along beak -->
    <path d="M182 108 C206 114 230 116 252 110" fill="none" stroke="#241c14" stroke-width="3.5" opacity="0.7"/>
    <!-- darker hooked tip -->
    <path d="M243 140 C252 146 252 156 240 154 C232 152 232 144 234 138 Z" fill="#a87f33"/>
    <!-- nostril -->
    <circle cx="206" cy="92" r="3" fill="#241c14"/>

    <!-- ============ CROSS-EYED DOPEY EYES (big, close together, pupils crossed in) ============ -->
    <circle cx="120" cy="70" r="21" fill="#f4ecd6"/>
    <circle cx="166" cy="70" r="21" fill="#f4ecd6"/>
    <circle cx="120" cy="70" r="21" fill="none" stroke="#241c14" stroke-width="3.4"/>
    <circle cx="166" cy="70" r="21" fill="none" stroke="#241c14" stroke-width="3.4"/>
    <!-- pupils both pulled to inner edges = cross-eyed -->
    <circle cx="136" cy="74" r="8" fill="#241c14"/>
    <circle cx="150" cy="74" r="8" fill="#241c14"/>
    <circle cx="133" cy="71" r="2.6" fill="#f4ecd6"/>
    <circle cx="147" cy="71" r="2.6" fill="#f4ecd6"/>
    <!-- silly high arched dopey brows (raised, surprised/harmless) -->
    <path d="M102 42 C112 32 130 32 140 40" fill="none" stroke="#241c14" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M148 40 C158 32 176 32 186 42" fill="none" stroke="#241c14" stroke-width="3.6" stroke-linecap="round"/>

    <!-- ============ silly head tuft feathers ============ -->
    <g fill="none" stroke="#241c14" stroke-width="4" stroke-linecap="round">
      <path d="M130 30 C128 14 138 8 142 16"/>
      <path d="M114 34 C108 20 114 12 122 18"/>
      <path d="M146 34 C152 20 164 14 162 24"/>
    </g>

    <!-- ============ TINY USELESS WING ============ -->
    <path d="M60 202 C36 202 22 218 26 234 C30 248 46 248 54 238
             C48 230 52 218 64 216 Z" fill="#988f7e"/>
    <path d="M38 212 L38 236 M48 210 L48 236" stroke="#241c14" stroke-width="2.5" opacity="0.6"/>

    <!-- ============ stubby legs + big goofy feet ============ -->
    <g fill="#c9a049" stroke="#241c14" stroke-width="3.4">
      <path d="M132 296 L132 308 M112 308 L152 308 M118 308 L116 300 M146 308 L148 300" fill="none" stroke-width="5"/>
      <path d="M188 296 L188 308 M168 308 L208 308 M174 308 L172 300 M202 308 L204 300" fill="none" stroke-width="5"/>
    </g>
  </g>

</svg>
