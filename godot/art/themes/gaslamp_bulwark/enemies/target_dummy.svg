<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - ENEMY "Target Dummy" (inert harmless practice dummy) -->
  <!-- Gaslamp Bulwark style. High 3/4 top-down. Default facing UP (north). -->
  <!-- HEAVILY CHIBI & comic: fat round straw-stuffed sackcloth body on a wooden post, crossbar -->
  <!-- arms, painted target rings, derpy stitched X-eyes. NO glow / NO menace (harmless). -->
  <!-- Flat two-tone: bone/parchment sack, brass/wood post, brimstone-red target rings. -->

  <!-- ground shadow under the post base -->
  <ellipse cx="48" cy="85" rx="24" ry="7.5" fill="#0b0d14" opacity="0.45"/>

  <!-- ===================== WOODEN POST + SPLAYED FEET (south, behind body) ===================== -->
  <g stroke="#101218" stroke-width="3.5" stroke-linecap="round">
    <path d="M48 78 L36 90"/>
    <path d="M48 78 L60 90"/>
  </g>
  <rect x="43" y="56" width="10" height="28" rx="3" fill="#caa24a" stroke="#101218" stroke-width="4" stroke-linejoin="round"/>
  <rect x="44" y="58" width="3.5" height="24" rx="1.5" fill="#e8c878" opacity="0.6"/>

  <!-- ===================== CROSSBAR ARMS (both flanks) ===================== -->
  <rect x="14" y="44" width="68" height="10" rx="5" fill="#caa24a" stroke="#101218" stroke-width="4" stroke-linejoin="round"/>
  <rect x="16" y="46" width="64" height="3" rx="1.5" fill="#e8c878" opacity="0.6"/>
  <!-- straw tufts bursting from the cuffs -->
  <g fill="#d9d2b0" stroke="#101218" stroke-width="2.4" stroke-linejoin="round">
    <path d="M14 49 L5 42 L12 51 L4 54 Z"/>
    <path d="M82 49 L91 42 L84 51 L92 54 Z"/>
  </g>

  <!-- ===================== FAT ROUND STUFFED SACKCLOTH BODY (centered) ===================== -->
  <!-- body shadow base -->
  <path d="M48 32 C68 32 75 48 73 62 C69 76 58 78 48 78 C38 78 27 76 23 62 C21 48 28 32 48 32 Z"
        fill="#8a7a52" stroke="#101218" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- sackcloth fill -->
  <path d="M48 34 C66 34 72 48 70 61 C66 73 57 75 48 75 C39 75 30 73 26 61 C24 48 30 34 48 34 Z"
        fill="#d9d2b0" stroke="#101218" stroke-width="4" stroke-linejoin="round"/>
  <!-- inner shadow (lower half) -->
  <path d="M70 61 C66 73 57 75 48 75 C39 75 30 73 26 61 C33 68 41 70 48 70 C55 70 63 68 70 61 Z"
        fill="#8a7a52" opacity="0.7"/>
  <!-- rim light -->
  <path d="M48 34 C64 34 70 45 68 54 C61 45 55 42 48 42 C41 42 35 45 28 54 C26 45 32 34 48 34 Z"
        fill="#e8e3d2" opacity="0.6"/>

  <!-- burlap stitch seam + cinch -->
  <path d="M48 36 L48 74" stroke="#8a7a52" stroke-width="2" opacity="0.7" stroke-dasharray="3 3"/>
  <path d="M30 64 C40 68 56 68 66 64" fill="none" stroke="#8a7a52" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <!-- straw poking from a torn seam -->
  <g fill="#caa24a" stroke="#101218" stroke-width="2" stroke-linejoin="round">
    <path d="M58 68 L67 72 L60 74 L66 78 Z"/>
  </g>

  <!-- ===================== PAINTED TARGET RINGS (on body front) ===================== -->
  <circle cx="48" cy="52" r="16" fill="none" stroke="#ff5a3c" stroke-width="3.5" opacity="0.85"/>
  <circle cx="48" cy="52" r="10.5" fill="none" stroke="#caa24a" stroke-width="3" opacity="0.8"/>
  <circle cx="48" cy="52" r="5.5" fill="none" stroke="#ff5a3c" stroke-width="3" opacity="0.85"/>
  <circle cx="48" cy="52" r="2.5" fill="#ff5a3c" opacity="0.9"/>
  <!-- arrows already stuck in it (comic, harmless) -->
  <g stroke="#101218" stroke-width="2.4" stroke-linecap="round">
    <path d="M63 41 L52 49"/>
    <path d="M35 65 L44 56"/>
  </g>
  <path d="M63 41 L68 37 M63 41 L68 43 M63 41 L66 38" stroke="#caa24a" stroke-width="2"/>
  <path d="M35 65 L30 69 M35 65 L30 63 M35 65 L32 67" stroke="#caa24a" stroke-width="2"/>

  <!-- ===================== DERPY STITCHED FACE (upper body) — harmless ===================== -->
  <g stroke="#101218" stroke-width="2.6" stroke-linecap="round">
    <path d="M38 40 L43 45 M43 40 L38 45"/>
    <path d="M53 40 L58 45 M58 40 L53 45"/>
  </g>
  <path d="M41 47 C45 51 51 51 55 47" fill="none" stroke="#101218" stroke-width="2.4" stroke-linecap="round"/>

  <!-- straw tuft sprouting from the top of the head -->
  <g fill="#caa24a" stroke="#101218" stroke-width="2.2" stroke-linejoin="round">
    <path d="M43 34 L41 23 L46 33 Z"/>
    <path d="M48 33 L48 21 L51 33 Z"/>
    <path d="M53 34 L57 24 L55 34 Z"/>
  </g>
</svg>
