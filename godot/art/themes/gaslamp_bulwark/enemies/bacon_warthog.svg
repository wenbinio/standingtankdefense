<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="58%" stop-color="#efe2c0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a36" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="paper" cx="40%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#f3e8c8"/>
      <stop offset="100%" stop-color="#e4d4ad"/>
    </radialGradient>
  </defs>

<g stroke-linejoin="round" stroke-linecap="round">

    <!-- ============ INK UNDERSHAPES (variable thick outline) ============ -->
    <g fill="#241c14">
      <!-- bulky boar body, hunched, charging-left lean (head low-left, rump high-right) -->
      <path d="M58 252 C40 224 44 186 70 162 C50 150 48 122 70 108
               C92 94 118 102 126 122 C150 110 196 108 234 124
               C282 144 296 188 286 226 C276 262 244 286 196 290
               C140 295 86 290 58 252 Z"/>
      <!-- big snout muzzle thrust forward-left -->
      <path d="M60 200 C36 196 18 176 22 154 C26 134 46 126 66 132
               C92 140 110 158 108 180 C106 198 84 204 60 200 Z"/>
      <!-- front leg -->
      <path d="M96 286 C90 304 92 314 104 314 C114 312 116 300 114 284 Z"/>
      <!-- back leg -->
      <path d="M214 286 C208 304 210 314 222 314 C232 312 234 300 232 284 Z"/>
    </g>

    <!-- ============ BODY (dusty rose-brown boar) ============ -->
    <path d="M64 248 C48 222 52 188 75 166 C56 154 55 128 74 115
             C94 102 116 110 123 129 C148 117 194 116 230 131
             C275 150 287 190 278 225 C268 258 238 280 195 284
             C142 289 90 284 64 248 Z" fill="#a86f63"/>
    <!-- bristly back / belly shading -->
    <path d="M110 200 C120 240 160 262 196 260 C244 257 268 230 270 200
             C252 240 150 252 110 200 Z" fill="#bb8579"/>

    <!-- bristly MOHAWK along the back -->
    <g fill="#241c14">
      <path d="M150 118 L142 86 L160 110 Z"/>
      <path d="M172 116 L168 80 L184 110 Z"/>
      <path d="M196 118 L196 80 L210 112 Z"/>
      <path d="M220 124 L226 90 L234 120 Z"/>
    </g>

    <!-- legs fill -->
    <path d="M99 282 C94 300 96 308 105 308 C112 306 114 296 112 282 Z" fill="#a86f63"/>
    <path d="M217 282 C212 300 214 308 223 308 C230 306 232 296 230 282 Z" fill="#a86f63"/>
    <!-- tiny hooves -->
    <path d="M96 304 L114 304 L112 314 L98 314 Z" fill="#241c14"/>
    <path d="M214 304 L232 304 L230 314 L216 314 Z" fill="#241c14"/>

    <!-- little ear -->
    <path d="M120 110 C108 96 110 80 124 84 C136 88 136 106 126 116 Z" fill="#a86f63" stroke="#241c14" stroke-width="3.5"/>

    <!-- ============ SNOUT MUZZLE ============ -->
    <path d="M62 196 C40 192 24 174 28 154 C32 136 50 130 68 136
             C92 143 108 160 106 180 C104 196 84 200 62 196 Z" fill="#c79a8e"/>
    <!-- flat snout disc with two nostrils, at the tip -->
    <ellipse cx="44" cy="166" rx="20" ry="24" fill="#b3837a" stroke="#241c14" stroke-width="3.4"/>
    <ellipse cx="40" cy="158" rx="4.5" ry="7" fill="#241c14"/>
    <ellipse cx="40" cy="176" rx="4.5" ry="7" fill="#241c14"/>

    <!-- ============ UPWARD TUSKS ============ -->
    <path d="M64 184 C52 184 44 168 50 152 C56 162 66 168 72 176 Z"
          fill="#f2ead4" stroke="#241c14" stroke-width="3.2"/>
    <path d="M88 188 C78 188 70 172 76 156 C82 166 90 174 96 182 Z"
          fill="#f2ead4" stroke="#241c14" stroke-width="3.2"/>

    <!-- ============ ANGRY EYES (pie-cut, beady) ============ -->
    <circle cx="108" cy="138" r="14" fill="#f4ecd6"/>
    <circle cx="148" cy="134" r="14" fill="#f4ecd6"/>
    <circle cx="108" cy="138" r="14" fill="none" stroke="#241c14" stroke-width="3"/>
    <circle cx="148" cy="134" r="14" fill="none" stroke="#241c14" stroke-width="3"/>
    <!-- pupils cut toward snout (down-left) -->
    <path d="M104 142 L96 132 A10 10 0 0 0 110 146 Z" fill="#241c14"/>
    <path d="M144 138 L136 128 A10 10 0 0 0 150 142 Z" fill="#241c14"/>
    <!-- heavy angry brows slanting hard inward-down -->
    <path d="M90 120 C100 122 114 130 120 138" fill="none" stroke="#241c14" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M134 118 C144 122 156 130 162 138" fill="none" stroke="#241c14" stroke-width="6.5" stroke-linecap="round"/>

    <!-- curly tail at rump -->
    <path d="M286 210 C302 206 308 220 298 228 C290 234 282 228 288 220"
          fill="none" stroke="#241c14" stroke-width="5" stroke-linecap="round"/>
  </g>

</svg>
