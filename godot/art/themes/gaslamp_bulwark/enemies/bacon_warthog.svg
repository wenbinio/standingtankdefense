<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - ENEMY "Bacon" (fast lean twin-blade skirmisher) -->
  <!-- Gaslamp Bulwark style. High 3/4 top-down. Default facing UP (north). -->
  <!-- HEAVILY CHIBI but leaner/lower than grunt: round rot-green body lunging forward, -->
  <!-- TWIN stubby steel blades thrust north, speed-smear behind, crossed straps, big keen eyes. -->
  <defs>
    <filter id="ra_menace" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="ra_motion" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- speed-smear behind (south), reads "quick" -->
  <path d="M30 92 C34 78 38 70 48 64 C58 70 62 78 66 92 Z"
        fill="#5e8c3a" filter="url(#ra_motion)" opacity="0.4"/>

  <!-- ground shadow (lean) -->
  <ellipse cx="48" cy="84" rx="24" ry="7" fill="#0b0d14" opacity="0.45"/>

  <!-- ===================== TINY STUBBY FEET (low crouch) ===================== -->
  <g stroke="#101218" stroke-width="4" stroke-linejoin="round">
    <path d="M39 76 C36 84 38 88 43 87 C46 86 46 80 45 76 Z" fill="#1f3322"/>
    <path d="M51 76 C54 84 52 88 47 87 C44 86 44 80 45 76 Z" fill="#1f3322"/>
  </g>

  <!-- ===================== TWIN STUBBY BLADES (both fists, thrust north) ===================== -->
  <!-- left blade -->
  <path d="M24 22 L31 20 L40 50 L33 53 Z" fill="#6f8db3" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M26 24 L36 49" fill="none" stroke="#bcd6f2" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
  <!-- right blade -->
  <path d="M72 22 L65 20 L56 50 L63 53 Z" fill="#6f8db3" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M70 24 L60 49" fill="none" stroke="#bcd6f2" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
  <!-- chunky stubby arms to grips -->
  <path d="M34 56 C28 53 27 49 31 47 C37 50 39 53 39 57 Z"
        fill="#5e8c3a" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M62 56 C68 53 69 49 65 47 C59 50 57 53 57 57 Z"
        fill="#5e8c3a" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- ===================== LEAN ROUND BODY (lunging forward) ===================== -->
  <!-- body shadow base -->
  <path d="M48 38 C68 38 73 54 70 67 C66 78 57 80 48 80 C39 80 30 78 26 67 C23 54 28 38 48 38 Z"
        fill="#1f3322" stroke="#101218" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- main flesh fill -->
  <path d="M48 40 C66 40 71 54 68 66 C64 75 56 77 48 77 C40 77 32 75 28 66 C25 54 30 40 48 40 Z"
        fill="#5e8c3a" stroke="#101218" stroke-width="4" stroke-linejoin="round"/>
  <!-- inner shadow -->
  <path d="M68 66 C64 75 56 77 48 77 C40 77 32 75 28 66 C34 71 41 73 48 73 C55 73 62 71 68 66 Z"
        fill="#1f3322" opacity="0.85"/>
  <!-- forward rim light -->
  <path d="M48 40 C64 40 69 50 67 59 C60 49 54 47 48 47 C42 47 36 49 29 59 C27 50 32 40 48 40 Z"
        fill="#a6d65e" opacity="0.55"/>

  <!-- crossed leather straps over chest -->
  <g stroke="#3a2a16" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <path d="M38 50 L58 72"/>
    <path d="M58 50 L38 72"/>
  </g>

  <!-- ===================== OVERSIZED FEATURES (keen, fast) ===================== -->
  <!-- twin stubby tusks (sharp) -->
  <g fill="#d9d2b0" stroke="#101218" stroke-width="2.8" stroke-linejoin="round">
    <path d="M40 64 L36 52 L46 62 Z"/>
    <path d="M56 64 L60 52 L50 62 Z"/>
  </g>

  <!-- big narrowed keen menace eyes -->
  <g>
    <circle cx="41" cy="57" r="7" fill="#ff5a3c" filter="url(#ra_menace)"/>
    <path d="M35 56 L46 54 L46 60 L35 59 Z" fill="#ff5a3c" stroke="#101218" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="40" cy="56.5" r="1.5" fill="#ffd0c2"/>
    <circle cx="55" cy="58" r="7" fill="#ff5a3c" filter="url(#ra_menace)"/>
    <path d="M61 57 L50 55 L50 61 L61 60 Z" fill="#ff5a3c" stroke="#101218" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="56" cy="57.5" r="1.5" fill="#ffd0c2"/>
  </g>
  <!-- sharp slanted angry brows -->
  <g stroke="#101218" stroke-width="3.5" stroke-linecap="round">
    <line x1="33" y1="48" x2="46" y2="53"/>
    <line x1="63" y1="49" x2="50" y2="54"/>
  </g>
</svg>
