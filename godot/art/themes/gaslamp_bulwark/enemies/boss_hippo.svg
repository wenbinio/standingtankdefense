<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="58%" stop-color="#efe2c0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a36" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="paper" cx="38%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#f3e8c8"/>
      <stop offset="100%" stop-color="#e4d4ad"/>
    </radialGradient>
    <radialGradient id="mir" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#eadfb8"/>
      <stop offset="70%" stop-color="#c3b083"/>
      <stop offset="100%" stop-color="#8f7c52"/>
    </radialGradient>
  </defs>

<g stroke-linejoin="round" stroke-linecap="round">

    <!-- ============ INK UNDERSHAPES (variable thick outline) ============ -->
    <g fill="#241c14">
      <!-- left noodle arm (curving down then up holding bag) -->
      <path d="M96 196 C58 206 30 196 24 166 C19 142 38 128 54 138
               C46 158 60 176 96 174 Z"/>
      <!-- right noodle arm raised high w/ syringe -->
      <path d="M222 150 C250 122 268 96 286 70 C300 50 322 60 312 80
               C300 104 276 132 240 158 Z"/>
      <!-- body blob -->
      <path d="M159 304 C92 304 58 262 58 212 C58 168 78 148 96 137
               C82 118 86 92 108 82 C124 75 142 81 150 95
               C156 90 166 90 172 95 C182 80 204 76 220 88
               C242 102 240 128 226 140 C246 154 266 178 266 214
               C266 266 228 304 159 304 Z"/>
      <!-- snout ink -->
      <path d="M101 192 C87 192 79 208 79 226 C79 252 110 270 160 270
               C210 270 241 252 241 226 C241 208 233 192 219 192
               C201 180 119 180 101 192 Z"/>
    </g>

    <!-- ============ left arm fill + glove ============ -->
    <path d="M96 188 C62 197 36 188 31 163 C27 143 41 134 51 144
             C46 162 64 170 96 167 Z" fill="#8fa19a"/>
    <circle cx="36" cy="156" r="15" fill="#f4ecd6"/>
    <circle cx="36" cy="156" r="15" fill="none" stroke="#241c14" stroke-width="2.6"/>
    <path d="M28 156 a8 8 0 0 1 16 0 M36 148 v16" fill="none" stroke="#241c14" stroke-width="2"/>

    <!-- ============ right arm fill ============ -->
    <path d="M226 146 C252 120 268 96 284 73 C295 57 308 64 301 79
             C290 102 268 128 234 154 Z" fill="#8fa19a"/>

    <!-- ============ BODY ============ -->
    <path d="M159 296 C98 296 66 258 66 212 C66 172 84 154 100 144
             C87 124 91 100 111 91 C126 84 140 90 148 103
             C155 98 165 98 171 103 C182 90 203 86 217 96
             C236 109 234 131 222 143 C241 158 258 180 258 213
             C258 260 222 296 159 296 Z" fill="#8fa19a"/>
    <path d="M118 214 C118 252 145 278 174 278 C212 278 228 248 224 216
             C212 252 150 256 118 214 Z" fill="#abbab2"/>

    <!-- tiny ears -->
    <path d="M116 92 C105 80 109 66 122 70 C133 74 132 90 124 98 Z" fill="#8fa19a" stroke="#241c14" stroke-width="3"/>
    <path d="M204 96 C214 83 228 87 226 99 C224 110 211 112 203 104 Z" fill="#8fa19a" stroke="#241c14" stroke-width="3"/>

    <!-- ============ SNOUT ============ -->
    <path d="M111 194 C97 194 89 208 89 226 C89 248 116 264 160 264
             C204 264 231 248 231 226 C231 208 223 194 209 194
             C193 184 127 184 111 194 Z" fill="#c79a8e"/>
    <ellipse cx="133" cy="222" rx="11" ry="14" fill="#241c14"/>
    <ellipse cx="187" cy="222" rx="11" ry="14" fill="#241c14"/>
    <ellipse cx="130" cy="217" rx="3.5" ry="5" fill="#dcbab0"/>
    <ellipse cx="184" cy="217" rx="3.5" ry="5" fill="#dcbab0"/>

    <!-- grin + blunt tusks -->
    <path d="M106 250 C122 272 198 272 214 250 C198 264 122 264 106 250 Z" fill="#241c14"/>
    <path d="M120 252 C118 266 127 271 133 263 C133 254 128 250 120 252 Z" fill="#f2ead4"/>
    <path d="M200 252 C202 266 193 271 187 263 C187 254 192 250 200 252 Z" fill="#f2ead4"/>

    <!-- ============ EYES (pie-cut) ============ -->
    <circle cx="133" cy="171" r="19" fill="#f4ecd6"/>
    <circle cx="187" cy="171" r="19" fill="#f4ecd6"/>
    <circle cx="133" cy="171" r="19" fill="none" stroke="#241c14" stroke-width="3.4"/>
    <circle cx="187" cy="171" r="19" fill="none" stroke="#241c14" stroke-width="3.4"/>
    <path d="M138 167 L138 185 A14 14 0 0 1 122 174 Z" fill="#241c14"/>
    <path d="M182 167 L182 185 A14 14 0 0 0 198 174 Z" fill="#241c14"/>
    <path d="M112 153 C123 145 142 147 150 156" fill="none" stroke="#241c14" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M170 156 C178 147 197 145 208 153" fill="none" stroke="#241c14" stroke-width="4.2" stroke-linecap="round"/>

    <!-- ============ DOCTOR HEAD MIRROR (off to side, on a band) ============ -->
    <!-- head band across brow -->
    <path d="M104 116 C130 104 190 104 216 116" fill="none" stroke="#241c14" stroke-width="6"/>
    <path d="M104 116 C130 105 190 105 216 116" fill="none" stroke="#b5573f" stroke-width="3"/>
    <!-- reflector boom + disc, up-left so it doesn't read as a third eye -->
    <path d="M150 116 L132 92" stroke="#241c14" stroke-width="6"/>
    <circle cx="124" cy="84" r="20" fill="#241c14"/>
    <circle cx="124" cy="84" r="15" fill="url(#mir)"/>
    <circle cx="124" cy="84" r="6" fill="#3a3026"/>
    <path d="M118 78 a6 6 0 0 1 6 0" fill="none" stroke="#f4ecd6" stroke-width="3" stroke-linecap="round"/>
    <path d="M112 72 L120 80" stroke="#f4ecd6" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ============ OVERSIZED SYRINGE (right glove up high) ============ -->
    <!-- white glove -->
    <circle cx="276" cy="74" r="15" fill="#f4ecd6"/>
    <circle cx="276" cy="74" r="15" fill="none" stroke="#241c14" stroke-width="2.6"/>
    <g transform="rotate(48 276 74)">
      <rect x="262" y="60" width="74" height="28" rx="6" fill="#241c14"/>
      <rect x="266" y="64" width="58" height="20" rx="4" fill="#cdb4ad"/>
      <rect x="268" y="66" width="36" height="16" rx="3" fill="#b3823b"/>
      <rect x="259" y="54" width="8" height="40" rx="3" fill="#241c14"/>
      <rect x="324" y="68" width="22" height="12" rx="3" fill="#241c14"/>
      <circle cx="348" cy="74" r="8" fill="#c79a8e" stroke="#241c14" stroke-width="3"/>
      <path d="M262 74 L236 74" stroke="#241c14" stroke-width="5"/>
      <path d="M238 74 L222 74" stroke="#9a8a64" stroke-width="2.5"/>
    </g>

    <!-- toe nails -->
    <g fill="#f2ead4" stroke="#241c14" stroke-width="2">
      <ellipse cx="120" cy="290" rx="7" ry="6"/>
      <ellipse cx="160" cy="294" rx="7" ry="6"/>
      <ellipse cx="200" cy="290" rx="7" ry="6"/>
    </g>
  </g>

</svg>
