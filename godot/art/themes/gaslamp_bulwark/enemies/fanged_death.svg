<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="58%" stop-color="#efe2c0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a36" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="paper" cx="40%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#f3e8c8"/>
      <stop offset="100%" stop-color="#e4d4ad"/>
    </radialGradient>
  </defs>

<g stroke-linejoin="round" stroke-linecap="round">

    <!-- ============ INK UNDERSHAPES (variable thick outline) ============ -->
    <g fill="#241c14">
      <!-- fat blubbery body blob, leaning forward (heavy toward viewer) -->
      <path d="M160 300 C70 300 36 256 36 198 C36 150 60 116 100 100
               C92 80 104 56 134 52 C160 49 178 62 184 82
               C214 76 250 92 268 124 C286 156 288 196 280 226
               C270 270 236 300 160 300 Z"/>
      <!-- big jowly snout mass -->
      <path d="M96 196 C78 196 66 216 66 240 C66 274 108 296 160 296
               C212 296 254 274 254 240 C254 216 242 196 224 196
               C200 182 120 182 96 196 Z"/>
      <!-- left tiny flipper -->
      <path d="M70 268 C46 282 32 304 42 312 C58 312 80 298 92 280 Z"/>
      <!-- right tiny flipper -->
      <path d="M250 268 C274 282 288 304 278 312 C262 312 240 298 228 280 Z"/>
    </g>

    <!-- ============ BODY (dusty teal-grey blubber) ============ -->
    <path d="M160 292 C76 292 44 250 44 198 C44 152 67 121 104 106
             C95 86 107 64 134 60 C158 57 174 70 179 89
             C213 82 246 99 262 128 C278 158 280 195 272 224
             C262 264 230 292 160 292 Z" fill="#7d9690"/>
    <!-- belly highlight -->
    <path d="M104 214 C104 256 138 280 168 280 C214 280 246 250 248 214
             C234 252 150 258 104 214 Z" fill="#9cb1ab"/>

    <!-- tiny flippers fill -->
    <path d="M74 264 C52 278 40 296 49 304 C63 303 82 290 92 274 Z" fill="#7d9690"/>
    <path d="M246 264 C268 278 280 296 271 304 C257 303 238 290 228 274 Z" fill="#7d9690"/>

    <!-- ============ SNOUT (blubbery muzzle) ============ -->
    <path d="M101 200 C84 200 73 218 73 240 C73 270 110 290 160 290
             C210 290 247 270 247 240 C247 218 236 200 219 200
             C197 188 123 188 101 200 Z" fill="#a99478"/>
    <!-- nostrils -->
    <ellipse cx="138" cy="222" rx="9" ry="12" fill="#241c14"/>
    <ellipse cx="182" cy="222" rx="9" ry="12" fill="#241c14"/>
    <ellipse cx="136" cy="218" rx="2.6" ry="4" fill="#c0a486"/>
    <ellipse cx="180" cy="218" rx="2.6" ry="4" fill="#c0a486"/>

    <!-- ============ BRISTLY WHISKERS ============ -->
    <g stroke="#241c14" stroke-width="2.4" fill="none" opacity="0.85">
      <path d="M108 244 C82 246 62 250 44 258"/>
      <path d="M110 252 C86 258 66 266 50 278"/>
      <path d="M210 244 C236 246 256 250 274 258"/>
      <path d="M208 252 C232 258 252 266 268 278"/>
    </g>
    <!-- whisker dots -->
    <g fill="#241c14" opacity="0.7">
      <circle cx="118" cy="244" r="2"/><circle cx="120" cy="252" r="2"/>
      <circle cx="124" cy="260" r="2"/>
      <circle cx="200" cy="244" r="2"/><circle cx="198" cy="252" r="2"/>
      <circle cx="194" cy="260" r="2"/>
    </g>

    <!-- ============ BIG BLUNT DOWNWARD TUSKS ============ -->
    <path d="M126 256 C120 290 124 312 138 312 C150 312 150 290 144 258 Z"
          fill="#f2ead4" stroke="#241c14" stroke-width="3.4"/>
    <path d="M176 258 C170 290 170 312 182 312 C196 312 200 290 194 256 Z"
          fill="#f2ead4" stroke="#241c14" stroke-width="3.4"/>

    <!-- ============ SMALL GRUMPY EYES (pie-cut) ============ -->
    <circle cx="130" cy="156" r="15" fill="#f4ecd6"/>
    <circle cx="190" cy="156" r="15" fill="#f4ecd6"/>
    <circle cx="130" cy="156" r="15" fill="none" stroke="#241c14" stroke-width="3.2"/>
    <circle cx="190" cy="156" r="15" fill="none" stroke="#241c14" stroke-width="3.2"/>
    <path d="M134 153 L134 168 A11 11 0 0 1 121 159 Z" fill="#241c14"/>
    <path d="M186 153 L186 168 A11 11 0 0 0 199 159 Z" fill="#241c14"/>
    <!-- heavy grumpy brows, low and slanted in -->
    <path d="M110 142 C122 136 140 140 148 148" fill="none" stroke="#241c14" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M172 148 C180 140 198 136 210 142" fill="none" stroke="#241c14" stroke-width="6.5" stroke-linecap="round"/>

    <!-- brow ridge wrinkle -->
    <path d="M150 128 C156 122 164 122 170 128" fill="none" stroke="#241c14" stroke-width="3" opacity="0.6"/>
  </g>

</svg>
