<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - ENEMY "Squeakzilla" (basic weak mob, 200 HP) -->
  <!-- Gaslamp Bulwark style. High 3/4 top-down. Default facing UP (north). -->
  <!-- HEAVILY CHIBI: big round rot-green head/body (~65% canvas), oversized cute-angry -->
  <!-- eyes, stubby bone tusks, tiny crude axe held close, tiny stubby feet. ~1.7 heads tall. -->
  <defs>
    <filter id="g_menace" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <!-- ground shadow under pivot -->
  <ellipse cx="48" cy="84" rx="28" ry="9" fill="#0b0d14" opacity="0.45"/>

  <!-- ===================== TINY STUBBY FEET (peeking under big body) ===================== -->
  <g stroke="#101218" stroke-width="4" stroke-linejoin="round">
    <path d="M37 76 C34 84 36 88 41 87 C45 86 45 80 44 76 Z" fill="#1f3322"/>
    <path d="M52 76 C55 84 53 88 48 87 C44 86 44 80 45 76 Z" fill="#1f3322"/>
  </g>

  <!-- ===================== CRUDE AXE (tiny, held close in stubby arm) ===================== -->
  <!-- short stubby haft -->
  <rect x="70" y="44" width="6" height="22" rx="3" fill="#1f3322" stroke="#101218" stroke-width="3.5" stroke-linejoin="round" transform="rotate(16 73 55)"/>
  <!-- blunt little axe head -->
  <path d="M64 40 L80 35 L83 50 L72 50 L78 56 L64 54 Z"
        fill="#6f8db3" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M64 54 L78 56 L72 50 L67 49 Z" fill="#3a4a63" opacity="0.85"/>
  <path d="M64 40 L80 35 L81 40 L65 45 Z" fill="#bcd6f2" opacity="0.7"/>

  <!-- stubby little arm reaching to axe -->
  <path d="M62 56 C70 54 74 52 73 48 C66 49 60 52 58 56 Z"
        fill="#5e8c3a" stroke="#101218" stroke-width="4" stroke-linejoin="round"/>

  <!-- ===================== BIG ROUND PUDGY BODY (dominant mass, leaning forward) ===================== -->
  <!-- body base/shadow (big bubble) -->
  <path d="M48 34 C72 34 78 54 74 68 C70 80 58 82 48 82 C38 82 26 80 22 68 C18 54 24 34 48 34 Z"
        fill="#1f3322" stroke="#101218" stroke-width="5" stroke-linejoin="round"/>
  <!-- main flesh fill -->
  <path d="M48 36 C70 36 75 54 71 67 C67 77 57 79 48 79 C39 79 29 77 25 67 C21 54 26 36 48 36 Z"
        fill="#5e8c3a" stroke="#101218" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- inner shadow on away (lower) half -->
  <path d="M71 67 C67 77 57 79 48 79 C39 79 29 77 25 67 C32 73 40 75 48 75 C56 75 64 73 71 67 Z"
        fill="#1f3322" opacity="0.85"/>
  <!-- forward rim light (camera-facing top edge) -->
  <path d="M48 36 C66 36 72 48 70 58 C62 47 56 44 48 44 C40 44 34 47 26 58 C24 48 30 36 48 36 Z"
        fill="#a6d65e" opacity="0.55"/>

  <!-- chunky stubby left arm/fist (held close) -->
  <path d="M26 58 C18 60 16 66 21 69 C28 67 32 63 33 59 Z"
        fill="#5e8c3a" stroke="#101218" stroke-width="4" stroke-linejoin="round"/>

  <!-- big rounded bone shoulder lump (asymmetric, left) -->
  <path d="M27 48 C18 46 15 53 20 58 C27 56 31 54 33 52 Z"
        fill="#d9d2b0" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- ===================== OVERSIZED FEATURES on the big front face ===================== -->
  <!-- stubby bone tusks jutting up (chunky, blunt, asymmetric) -->
  <g fill="#d9d2b0" stroke="#101218" stroke-width="3" stroke-linejoin="round">
    <path d="M38 62 L34 48 L45 60 Z"/>
    <path d="M58 62 L63 46 L52 60 Z"/>
  </g>

  <!-- HUGE cute-angry menace-orange eyes (dominant feature) -->
  <g>
    <circle cx="40" cy="55" r="8.5" fill="#ff5a3c" filter="url(#g_menace)"/>
    <circle cx="40" cy="55" r="6.5" fill="#ff5a3c" stroke="#101218" stroke-width="2.5"/>
    <circle cx="38" cy="53" r="2" fill="#ffd0c2"/>
    <circle cx="57" cy="56" r="8.5" fill="#ff5a3c" filter="url(#g_menace)"/>
    <circle cx="57" cy="56" r="6.5" fill="#ff5a3c" stroke="#101218" stroke-width="2.5"/>
    <circle cx="55" cy="54" r="2" fill="#ffd0c2"/>
  </g>
  <!-- angry brows (chunky, slanted inward = cute-angry) -->
  <g stroke="#101218" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="46" x2="45" y2="50"/>
    <line x1="65" y1="47" x2="52" y2="51"/>
  </g>
</svg>
