<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - ENEMY "Nope Rope" (robed orc caster, arcane glow) -->
  <!-- Gaslamp Bulwark style. High 3/4 top-down. Default facing UP (north). -->
  <!-- HEAVILY CHIBI: same rot-green orc family (tusks, big eyes) but cloaked in a fat round -->
  <!-- robe-bell body; stubby crook-staff raising a floating SICK-BILE arcane orb. Caster glow -->
  <!-- = rot-bright green (NOT melee orange) so it reads "caster" while staying enemy team. -->
  <defs>
    <filter id="wl_arc" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="wl_eye" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="48" cy="85" rx="27" ry="8" fill="#0b0d14" opacity="0.45"/>

  <!-- ===================== STUBBY CROOK STAFF + FLOATING ARCANE ORB (north-left) ===================== -->
  <rect x="24" y="22" width="5" height="56" rx="2.5" fill="#3a2a16" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- forked crook cradling the orb -->
  <path d="M26 26 C20 22 17 24 16 20 M26 26 C32 22 35 24 36 22"
        fill="none" stroke="#3a2a16" stroke-width="3.5" stroke-linecap="round"/>
  <!-- floating sick-bile arcane orb -->
  <circle cx="26" cy="16" r="11" fill="#a6d65e" filter="url(#wl_arc)"/>
  <circle cx="26" cy="16" r="7" fill="#a6d65e" stroke="#101218" stroke-width="3"/>
  <circle cx="23.5" cy="13.5" r="2.2" fill="#e8e3d2" opacity="0.9"/>
  <!-- orbiting motes -->
  <circle cx="37" cy="13" r="2" fill="#a6d65e" filter="url(#wl_eye)"/>
  <circle cx="16" cy="23" r="1.8" fill="#a6d65e" filter="url(#wl_eye)"/>

  <!-- ===================== FAT ROUND ROBE-BELL BODY (dominant mass) ===================== -->
  <!-- robe shadow base -->
  <path d="M48 34 C70 34 78 52 76 68 C74 82 60 84 48 84 C36 84 22 82 20 68 C18 52 26 34 48 34 Z"
        fill="#241830" stroke="#101218" stroke-width="5" stroke-linejoin="round"/>
  <!-- robe main fill (dark sorcerer purple) -->
  <path d="M48 36 C68 36 75 52 73 67 C71 79 59 81 48 81 C37 81 25 79 23 67 C21 52 28 36 48 36 Z"
        fill="#3a2a4a" stroke="#101218" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- robe inner shadow (lower half) -->
  <path d="M73 67 C71 79 59 81 48 81 C37 81 25 79 23 67 C31 74 39 76 48 76 C57 76 65 74 73 67 Z"
        fill="#241830" opacity="0.85"/>
  <!-- forward rim light -->
  <path d="M48 36 C65 36 72 48 70 58 C62 48 55 45 48 45 C41 45 34 48 26 58 C24 48 31 36 48 36 Z"
        fill="#5a3f74" opacity="0.6"/>

  <!-- robe folds -->
  <g stroke="#241830" stroke-width="2.5" opacity="0.7" stroke-linecap="round">
    <path d="M38 62 C37 70 39 76 38 81"/>
    <path d="M58 62 C59 70 57 76 58 81"/>
    <path d="M48 66 L48 81"/>
  </g>
  <!-- arcane-rune hem (faint bile green) -->
  <path d="M30 77 L36 73 L42 77 L48 73 L54 77 L60 73 L66 77"
        fill="none" stroke="#a6d65e" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

  <!-- ===================== HOODED GREEN ORC FACE (center) ===================== -->
  <!-- cowl drape behind face -->
  <path d="M30 50 C30 38 40 34 48 34 C56 34 66 38 66 50 C58 44 38 44 30 50 Z"
        fill="#3a2a4a" stroke="#101218" stroke-width="4" stroke-linejoin="round"/>
  <!-- round green face -->
  <path d="M48 44 C62 44 66 54 66 62 C66 72 58 76 48 76 C38 76 30 72 30 62 C30 54 34 44 48 44 Z"
        fill="#5e8c3a" stroke="#101218" stroke-width="4" stroke-linejoin="round"/>
  <!-- hood AO over upper face -->
  <path d="M30 58 C32 46 42 42 48 42 C54 42 64 46 66 58 C58 51 38 51 30 58 Z"
        fill="#241830" opacity="0.6"/>
  <!-- face inner shadow lower -->
  <path d="M66 62 C66 72 58 76 48 76 C38 76 30 72 30 62 C36 69 42 71 48 71 C54 71 60 69 66 62 Z"
        fill="#1f3322" opacity="0.7"/>

  <!-- arcane green glowing eyes (caster read) -->
  <g>
    <circle cx="41" cy="60" r="7" fill="#a6d65e" filter="url(#wl_arc)"/>
    <circle cx="41" cy="60" r="5" fill="#a6d65e" stroke="#101218" stroke-width="2.2"/>
    <circle cx="39.5" cy="58.5" r="1.6" fill="#e8e3d2"/>
    <circle cx="55" cy="60" r="7" fill="#a6d65e" filter="url(#wl_arc)"/>
    <circle cx="55" cy="60" r="5" fill="#a6d65e" stroke="#101218" stroke-width="2.2"/>
    <circle cx="53.5" cy="58.5" r="1.6" fill="#e8e3d2"/>
  </g>

  <!-- muttering maw + twin tusks -->
  <g fill="#d9d2b0" stroke="#101218" stroke-width="2.8" stroke-linejoin="round">
    <path d="M41 71 L37 60 L47 69 Z"/>
    <path d="M55 71 L59 60 L49 69 Z"/>
  </g>
</svg>
