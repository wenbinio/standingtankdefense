<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="58%" stop-color="#efe2c0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a36" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="paper" cx="38%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#f3e8c8"/>
      <stop offset="100%" stop-color="#e4d4ad"/>
    </radialGradient>
    <radialGradient id="hood" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#9aa86e"/>
      <stop offset="100%" stop-color="#6f7d4a"/>
    </radialGradient>
  </defs>

<g stroke-linejoin="round" stroke-linecap="round">

    <!-- ============ INK UNDERSHAPES ============ -->
    <g fill="#241c14">
      <!-- coiled base body (S-rising trunk) -->
      <path d="M70 300 C40 300 30 278 44 262 C30 252 30 230 50 224
               C30 214 36 188 62 188 C50 168 64 148 90 150
               C84 130 100 112 124 116 C118 142 128 168 150 178
               C176 190 188 214 184 244 C180 280 140 300 70 300 Z"/>
      <!-- flared HOOD behind head: wide cape spreading to both sides -->
      <path d="M158 70 C108 70 58 86 40 118 C30 136 44 156 70 158
               C100 160 118 140 130 120 C140 138 178 138 188 120
               C200 140 220 160 250 158 C276 156 290 136 280 118
               C262 86 210 70 158 70 Z"/>
      <!-- head mass -->
      <path d="M112 92 C112 64 134 48 158 48 C188 48 208 68 208 96
               C208 124 186 140 158 140 C130 140 112 118 112 92 Z"/>
    </g>

    <!-- ============ COILED BODY fill ============ -->
    <path d="M72 292 C46 292 38 274 50 261 C36 252 38 233 54 229
             C38 220 44 196 66 196 C56 178 68 158 92 160
             C86 140 102 124 122 128 C118 150 128 172 150 182
             C172 192 181 213 177 240 C173 274 138 292 72 292 Z" fill="#7d8a52"/>
    <!-- belly scale plates (cream stacked) -->
    <g fill="#e7dcb4" stroke="#241c14" stroke-width="2.2">
      <path d="M70 286 C58 286 50 278 52 270 C70 276 96 276 110 268 C112 280 96 288 70 286 Z"/>
      <path d="M62 258 C52 258 46 250 49 243 C66 250 90 248 100 240 C104 252 88 260 62 258 Z"/>
      <path d="M62 230 C54 230 49 222 52 216 C68 222 86 220 94 212 C98 224 84 232 62 230 Z"/>
    </g>
    <!-- diamond pattern on trunk -->
    <g fill="#5f6b3c" opacity="0.8">
      <path d="M120 150 l10 12 l-10 12 l-10 -12 Z"/>
      <path d="M138 184 l9 11 l-9 11 l-9 -11 Z"/>
    </g>

    <!-- ============ FLARED HOOD (wide cape) ============ -->
    <path d="M158 76 C110 76 62 91 46 120 C38 135 50 151 72 152
             C100 153 117 135 129 117 C140 134 176 134 187 117
             C199 135 218 153 246 152 C268 151 280 135 272 120
             C256 91 208 76 158 76 Z" fill="url(#hood)"/>
    <!-- hood ribs (fanning out from neck) -->
    <g fill="none" stroke="#4f5a34" stroke-width="3" opacity="0.7">
      <path d="M120 108 C100 116 82 128 70 144"/>
      <path d="M196 108 C216 116 234 128 246 144"/>
      <path d="M108 104 C88 110 70 122 58 138"/>
      <path d="M208 104 C228 110 246 122 258 138"/>
    </g>
    <!-- menacing hood spectacle marks (eyespots on the spread hood) -->
    <circle cx="92" cy="126" r="12" fill="#3f4a2a"/>
    <circle cx="92" cy="126" r="5" fill="#9aa86e"/>
    <circle cx="224" cy="126" r="12" fill="#3f4a2a"/>
    <circle cx="224" cy="126" r="5" fill="#9aa86e"/>

    <!-- ============ HEAD ============ -->
    <path d="M116 94 C116 68 137 52 159 52 C186 52 204 70 204 96
             C204 120 184 134 159 134 C133 134 116 116 116 94 Z" fill="#8a9760"/>
    <!-- head top highlight -->
    <path d="M126 72 C140 60 168 60 184 72 C166 68 142 68 128 82 Z" fill="#a3b078" opacity="0.6"/>

    <!-- ============ beady hypnotic eyes ============ -->
    <circle cx="140" cy="92" r="15" fill="#e8c23a"/>
    <circle cx="178" cy="92" r="15" fill="#e8c23a"/>
    <circle cx="140" cy="92" r="15" fill="none" stroke="#241c14" stroke-width="3.2"/>
    <circle cx="178" cy="92" r="15" fill="none" stroke="#241c14" stroke-width="3.2"/>
    <!-- vertical slit pupils -->
    <ellipse cx="142" cy="93" rx="3.4" ry="11" fill="#241c14"/>
    <ellipse cx="176" cy="93" rx="3.4" ry="11" fill="#241c14"/>
    <circle cx="140" cy="87" r="2.2" fill="#fff" opacity="0.8"/>
    <circle cx="174" cy="87" r="2.2" fill="#fff" opacity="0.8"/>
    <!-- low menacing brows -->
    <path d="M124 78 C134 72 150 74 156 82" fill="none" stroke="#241c14" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M164 82 C172 74 188 72 196 78" fill="none" stroke="#241c14" stroke-width="5.5" stroke-linecap="round"/>

    <!-- ============ MOUTH + FANGS + FORKED TONGUE ============ -->
    <path d="M132 118 C146 128 172 128 186 118 C172 124 146 124 132 118 Z" fill="#241c14"/>
    <!-- two fangs -->
    <path d="M142 122 C140 136 145 144 150 138 C150 128 147 122 142 122 Z" fill="#f2ead4" stroke="#241c14" stroke-width="2"/>
    <path d="M176 122 C178 136 173 144 168 138 C168 128 171 122 176 122 Z" fill="#f2ead4" stroke="#241c14" stroke-width="2"/>
    <!-- forked tongue flicking down -->
    <path d="M159 126 C158 144 150 156 144 168 M159 126 C160 144 168 156 174 168"
          fill="none" stroke="#b5573f" stroke-width="4" stroke-linecap="round"/>
    <path d="M144 168 l-5 8 M144 168 l3 9 M174 168 l5 8 M174 168 l-3 9"
          fill="none" stroke="#b5573f" stroke-width="3.4" stroke-linecap="round"/>
  </g>

</svg>
