<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="58%" stop-color="#efe2c0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a36" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="paper" cx="40%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#f3e8c8"/>
      <stop offset="100%" stop-color="#e4d4ad"/>
    </radialGradient>
  </defs>

<g stroke-linejoin="round" stroke-linecap="round">

    <!-- ============ INK UNDERSHAPES ============ -->
    <g fill="#241c14">
      <!-- round fuzzy duckling body (small, lower-center) -->
      <path d="M160 296 C108 296 78 264 78 224 C78 182 112 152 160 152
               C208 152 242 182 242 224 C242 264 212 296 160 296 Z"/>
      <!-- big round head fused on top -->
      <path d="M160 196 C120 196 96 168 96 134 C96 96 124 66 160 66
               C196 66 224 96 224 134 C224 168 200 196 160 196 Z"/>
      <!-- tiny left wing -->
      <path d="M92 214 C66 212 48 224 48 244 C48 262 66 266 82 256
               C74 244 80 226 100 226 Z"/>
      <!-- tiny right wing -->
      <path d="M228 214 C254 212 272 224 272 244 C272 262 254 266 238 256
               C246 244 240 226 220 226 Z"/>
      <!-- big bill mass (lower, proper snout) -->
      <path d="M114 156 C96 156 82 168 82 182 C82 198 102 208 138 208
               C160 208 174 198 174 184 C174 166 142 156 114 156 Z"/>
    </g>

    <!-- ============ BODY (fuzzy mustard duckling) ============ -->
    <path d="M160 288 C112 288 86 258 86 224 C86 186 116 160 160 160
             C204 160 234 186 234 224 C234 258 208 288 160 288 Z" fill="#d6b84e"/>
    <!-- belly highlight -->
    <path d="M110 230 C112 262 138 280 162 280 C200 280 222 256 220 226
             C208 258 144 264 110 230 Z" fill="#e6cf78"/>

    <!-- tiny wings fill -->
    <path d="M94 210 C70 208 54 220 54 240 C54 256 70 260 84 251
             C76 240 82 222 100 222 Z" fill="#d6b84e"/>
    <path d="M226 210 C250 208 266 220 266 240 C266 256 250 260 236 251
             C244 240 238 222 220 222 Z" fill="#d6b84e"/>

    <!-- ============ HEAD (fuzzy) ============ -->
    <path d="M160 188 C124 188 102 162 102 132 C102 98 128 72 160 72
             C192 72 218 98 218 132 C218 162 196 188 160 188 Z" fill="#dcc05a"/>
    <!-- fuzzy tuft on head -->
    <path d="M150 74 C146 58 152 46 160 50 C156 60 164 66 160 74 Z" fill="#dcc05a" stroke="#241c14" stroke-width="3"/>
    <path d="M168 74 C172 60 166 48 174 52 C170 62 178 68 172 76 Z" fill="#dcc05a" stroke="#241c14" stroke-width="3"/>

    <!-- ============ BIG ORANGE BILL (lower, snout) ============ -->
    <path d="M120 162 C102 162 88 172 88 184 C88 200 106 210 140 210
             C160 210 172 200 172 188 C172 170 142 162 120 162 Z" fill="#e08a32"/>
    <path d="M92 186 C108 192 152 192 168 186" fill="none" stroke="#241c14" stroke-width="3" opacity="0.7"/>
    <!-- bill nostril -->
    <ellipse cx="112" cy="178" rx="3" ry="2.4" fill="#241c14" opacity="0.7"/>

    <!-- ============ SINISTER EYES (pie-cut) ============ -->
    <circle cx="138" cy="120" r="16" fill="#f4ecd6"/>
    <circle cx="186" cy="120" r="16" fill="#f4ecd6"/>
    <circle cx="138" cy="120" r="16" fill="none" stroke="#241c14" stroke-width="3.2"/>
    <circle cx="186" cy="120" r="16" fill="none" stroke="#241c14" stroke-width="3.2"/>
    <!-- pupils cut toward the nose (scheming) -->
    <path d="M142 116 L142 132 A12 12 0 0 1 130 122 Z" fill="#241c14"/>
    <path d="M182 116 L182 132 A12 12 0 0 0 194 122 Z" fill="#241c14"/>
    <!-- ONE sinister HIGH-ARCHED raised eyebrow (right); low flat brow (left) -->
    <path d="M120 106 C132 104 148 105 156 109" fill="none" stroke="#241c14" stroke-width="6" stroke-linecap="round"/>
    <path d="M168 100 C176 82 198 80 208 92" fill="none" stroke="#241c14" stroke-width="6" stroke-linecap="round"/>

    <!-- ============ tiny feet ============ -->
    <g fill="#e08a32" stroke="#241c14" stroke-width="2.6">
      <path d="M138 286 C130 300 126 308 134 310 C142 308 144 298 146 286 Z"/>
      <path d="M178 286 C186 300 190 308 182 310 C174 308 172 298 174 286 Z"/>
    </g>
  </g>

</svg>
