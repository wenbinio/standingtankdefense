<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="58%" stop-color="#efe2c0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a36" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="paper" cx="40%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#f3e8c8"/>
      <stop offset="100%" stop-color="#e4d4ad"/>
    </radialGradient>
  </defs>

<g stroke-linejoin="round" stroke-linecap="round">

    <!-- ============ INK UNDERSHAPES (variable thick outline) ============ -->
    <g fill="#241c14">
      <!-- plump goose body, lower-right, leaning forward -->
      <path d="M176 300 C124 300 86 272 86 230 C86 196 110 170 150 164
               C194 158 240 172 264 202 C288 230 286 270 258 288
               C232 304 214 300 176 300 Z"/>
      <!-- long thin S-curved NECK: rises from body, curves up then arcs
           forward-left into the head (clear column, not merged) -->
      <path d="M150 240 C112 222 96 178 110 134 C120 100 110 72 126 56
               C140 70 138 96 142 128 C146 168 168 206 188 224 Z"/>
      <!-- head mass at top-left, leaning forward -->
      <path d="M104 60 C104 38 122 22 146 22 C168 22 182 38 182 60
               C182 82 166 96 144 96 C120 96 104 82 104 60 Z"/>
      <!-- flared little wing on body -->
      <path d="M250 210 C284 206 308 220 306 242 C304 260 284 264 268 254
               C280 240 274 222 244 224 Z"/>
    </g>

    <!-- ============ BODY (cream-grey goose) ============ -->
    <path d="M176 292 C128 292 94 266 94 230 C94 198 118 175 156 171
             C198 165 234 178 258 205 C282 230 282 264 257 282
             C232 298 212 292 176 292 Z" fill="#cfc5a6"/>
    <!-- belly shadow -->
    <path d="M118 236 C126 270 160 286 188 284 C236 281 262 258 264 230
             C246 266 152 274 118 236 Z" fill="#e0d8bf"/>

    <!-- wing fill -->
    <path d="M250 206 C280 202 300 216 298 238 C296 254 280 258 268 249
             C278 236 272 218 246 220 Z" fill="#cfc5a6"/>
    <path d="M254 214 C272 214 286 224 288 238" fill="none" stroke="#241c14" stroke-width="3" opacity="0.55"/>
    <path d="M250 226 C268 226 280 234 284 246" fill="none" stroke="#241c14" stroke-width="3" opacity="0.55"/>

    <!-- ============ S-NECK fill ============ -->
    <path d="M150 236 C116 218 102 178 115 137 C124 105 116 78 130 62
             C141 74 142 98 146 128 C150 166 170 204 188 220 Z" fill="#d4cab0"/>

    <!-- ============ HEAD ============ -->
    <path d="M110 60 C110 40 126 28 146 28 C166 28 178 41 178 60
             C178 80 164 90 144 90 C124 90 110 80 110 60 Z" fill="#d8cfb6"/>

    <!-- ============ BIG OPEN ORANGE BEAK (mid-honk, pointing left) ============ -->
    <!-- open mouth interior wedge first (behind bills) -->
    <path d="M112 58 C88 52 64 58 48 68 C66 74 96 72 116 66 Z" fill="#7a3a30"/>
    <!-- upper bill -->
    <path d="M114 50 C84 42 58 42 44 48 C56 60 86 62 114 58 Z"
          fill="#e08a32" stroke="#241c14" stroke-width="3.4"/>
    <!-- lower bill, gaping open -->
    <path d="M114 66 C86 68 64 74 52 84 C70 88 96 84 116 76 Z"
          fill="#cf7826" stroke="#241c14" stroke-width="3.4"/>
    <!-- nostril -->
    <ellipse cx="88" cy="50" rx="3" ry="2.2" fill="#241c14"/>

    <!-- ============ ONE BEADY EYE (small, set into head) ============ -->
    <circle cx="146" cy="58" r="9" fill="#f4ecd6"/>
    <circle cx="146" cy="58" r="9" fill="none" stroke="#241c14" stroke-width="2.6"/>
    <circle cx="143" cy="59" r="4.5" fill="#241c14"/>
    <circle cx="141.5" cy="57.5" r="1.4" fill="#f4ecd6"/>
    <!-- heavy angry brow slanting down toward beak -->
    <path d="M132 46 C140 46 150 50 157 56" fill="none" stroke="#241c14" stroke-width="6" stroke-linecap="round"/>

    <!-- ============ tiny feet ============ -->
    <g fill="#e08a32" stroke="#241c14" stroke-width="2.6">
      <path d="M156 290 C148 304 144 312 152 314 C160 312 162 302 164 290 Z"/>
      <path d="M198 290 C206 304 210 312 202 314 C194 312 192 302 194 290 Z"/>
    </g>
  </g>

</svg>
