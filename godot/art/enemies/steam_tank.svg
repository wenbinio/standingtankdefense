<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Standing Tank Defense - ENEMY "Steam Tank" (slow armored war-machine, 1200 HP) -->
  <!-- Gaslamp Bulwark style. High 3/4 top-down. Default facing UP (north). -->
  <!-- HEAVILY CHIBI TOY TANK: big fat rounded rusted rot-green hull (~65% canvas), ONE -->
  <!-- oversized stubby front gun, big belching furnace w/ menace-orange glow, tiny stubby -->
  <!-- treads under a bulbous body, bone/rivet accents. ~1.7 hulls tall. ENEMY: rot/bone/orange. -->
  <defs>
    <filter id="t_menace" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <!-- ground shadow: heavy footprint -->
  <ellipse cx="48" cy="84" rx="33" ry="9" fill="#0b0d14" opacity="0.5"/>

  <!-- ===================== TINY STUBBY TREADS/FEET (peeking under bulbous body) ===================== -->
  <g stroke="#101218" stroke-width="4" stroke-linejoin="round">
    <rect x="18" y="68" width="20" height="16" rx="7" fill="#1f3322"/>
    <rect x="58" y="68" width="20" height="16" rx="7" fill="#1f3322"/>
  </g>
  <!-- tread cleats (rungs) -->
  <g stroke="#101218" stroke-width="2.5" fill="#3a4a63">
    <rect x="21" y="72" width="14" height="4" rx="1.5"/>
    <rect x="21" y="78" width="14" height="4" rx="1.5"/>
    <rect x="61" y="72" width="14" height="4" rx="1.5"/>
    <rect x="61" y="78" width="14" height="4" rx="1.5"/>
  </g>
  <!-- tread rim light -->
  <rect x="21" y="69" width="14" height="3" rx="1.5" fill="#5e8c3a" opacity="0.6"/>
  <rect x="61" y="69" width="14" height="3" rx="1.5" fill="#5e8c3a" opacity="0.6"/>

  <!-- ===================== ONE OVERSIZED STUBBY FRONT GUN (faces UP) ===================== -->
  <rect x="38" y="16" width="20" height="20" rx="6" fill="#3a4a63" stroke="#101218" stroke-width="4.5" stroke-linejoin="round"/>
  <rect x="42" y="19" width="5" height="15" rx="2.5" fill="#6f8db3" opacity="0.7"/>
  <!-- chunky bone muzzle band -->
  <rect x="35" y="16" width="26" height="7" rx="3" fill="#d9d2b0" stroke="#101218" stroke-width="3.5"/>
  <ellipse cx="48" cy="19" rx="6" ry="2.5" fill="#e8e3d2" opacity="0.5"/>

  <!-- ===================== BIG FAT ROUNDED HULL (dominant bulbous mass) ===================== -->
  <!-- hull base/shadow (fat bubble) -->
  <path d="M48 26 C72 26 80 42 78 58 C76 72 64 76 48 76 C32 76 20 72 18 58 C16 42 24 26 48 26 Z"
        fill="#1f3322" stroke="#101218" stroke-width="5" stroke-linejoin="round"/>
  <!-- hull plate fill -->
  <path d="M48 28 C70 28 77 42 75 57 C73 70 62 73 48 73 C34 73 23 70 21 57 C19 42 26 28 48 28 Z"
        fill="#5e8c3a" stroke="#101218" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- hull inner shadow (away/lower half) -->
  <path d="M75 57 C73 70 62 73 48 73 C34 73 23 70 21 57 C30 64 39 66 48 66 C57 66 66 64 75 57 Z"
        fill="#1f3322" opacity="0.85"/>
  <!-- hull forward rim light (camera-facing top edge) -->
  <path d="M48 28 C66 28 73 38 72 48 C63 38 56 35 48 35 C40 35 33 38 24 48 C23 38 30 28 48 28 Z"
        fill="#a6d65e" opacity="0.55"/>

  <!-- bone-edged armor brow over the front (asymmetric: left chipped) -->
  <path d="M34 30 C42 28 54 28 62 30 C58 36 38 36 34 30 Z"
        fill="#d9d2b0" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M34 30 C42 28 54 28 62 30 C56 32 40 32 34 30 Z" fill="#e8e3d2" opacity="0.5"/>
  <!-- chip out of left front plate (battle damage) -->
  <path d="M37 33 L41 28 L45 33 Z" fill="#1f3322" stroke="#101218" stroke-width="2"/>

  <!-- ===================== BIG BELCHING FURNACE (center, menace-orange glow) ===================== -->
  <!-- furnace housing (chunky rounded) -->
  <path d="M34 48 L62 48 C64 48 65 50 64 52 L60 66 C59 68 57 68 55 68 L41 68 C39 68 37 68 36 66 L32 52 C31 50 32 48 34 48 Z"
        fill="#3a4a63" stroke="#101218" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M64 52 L60 66 C59 68 57 68 55 68 L41 68 C39 68 37 68 36 66 L32 52 L48 56 Z" fill="#1f3322" opacity="0.7"/>
  <!-- big furnace grate glow -->
  <ellipse cx="48" cy="57" rx="14" ry="9" fill="#ff5a3c" filter="url(#t_menace)"/>
  <ellipse cx="48" cy="57" rx="10.5" ry="6.5" fill="#ff5a3c" stroke="#101218" stroke-width="3"/>
  <!-- grate bars -->
  <g stroke="#101218" stroke-width="2.5">
    <line x1="42" y1="52" x2="42" y2="62"/>
    <line x1="48" y1="51" x2="48" y2="63"/>
    <line x1="54" y1="52" x2="54" y2="62"/>
  </g>
  <ellipse cx="48" cy="54" rx="4.5" ry="2.5" fill="#caa24a" opacity="0.85"/>

  <!-- ===================== TWO STUBBY EMBER SMOKESTACKS (asymmetric) ===================== -->
  <g stroke="#101218" stroke-width="3.5" stroke-linejoin="round">
    <rect x="24" y="42" width="9" height="11" rx="3" fill="#3a4a63"/>
    <rect x="63" y="46" width="9" height="9" rx="3" fill="#3a4a63"/>
  </g>
  <circle cx="28.5" cy="43" r="3.5" fill="#ff5a3c" filter="url(#t_menace)"/>
  <circle cx="28.5" cy="43" r="2" fill="#ff5a3c" stroke="#101218" stroke-width="1.3"/>
  <circle cx="67.5" cy="47" r="3" fill="#ff5a3c" filter="url(#t_menace)"/>
  <circle cx="67.5" cy="47" r="1.8" fill="#ff5a3c" stroke="#101218" stroke-width="1.3"/>

  <!-- ===================== RIVETS + BONE DETAIL (few, chunky) ===================== -->
  <g fill="#d9d2b0" stroke="#101218" stroke-width="1.8">
    <circle cx="27" cy="42" r="2.6"/>
    <circle cx="69" cy="42" r="2.6"/>
    <circle cx="29" cy="64" r="2.6"/>
    <circle cx="67" cy="64" r="2.6"/>
  </g>
</svg>
