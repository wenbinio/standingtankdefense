<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Standing Tank Defense - UI HEART / LIFE "Aether Bulwark Shield" -->
  <!-- Gaslamp Bulwark style. Player HP icon: ALLY palette (ours = blue glow). -->
  <!-- Heraldic brass/steel shield with an ally-glow aether heart core. Crisp at 24px. -->
  <defs>
    <filter id="ally_glow_ui" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="24" cy="43" rx="12" ry="3" fill="#0b0d14" opacity="0.4"/>

  <!-- ================= heraldic shield body (steel-blue) ================= -->
  <path d="M24 5 L40 10 V24 C40 33 33 40 24 44 C15 40 8 33 8 24 V10 Z"
        fill="#6f8db3" stroke="#101218" stroke-width="3" stroke-linejoin="round"/>

  <!-- inner shadow on the lower/away half -->
  <path d="M8 24 C8 33 15 40 24 44 C33 40 40 33 40 24 L40 22 C40 31 33 38 24 41 C15 38 8 31 8 22 Z"
        fill="#3a4a63" opacity="0.85"/>

  <!-- top rim light along the camera-facing upper edge -->
  <path d="M24 8 L37 12 V15 L24 11 L11 15 V12 Z" fill="#bcd6f2" opacity="0.7"/>

  <!-- brass trim band framing the shield -->
  <path d="M24 5 L40 10 V24 C40 33 33 40 24 44 C15 40 8 33 8 24 V10 Z"
        fill="none" stroke="#caa24a" stroke-width="2" stroke-linejoin="round" opacity="0.9"/>

  <!-- ================= aether heart core (the "life", glowing blue) ================= -->
  <!-- soft halo -->
  <path d="M24 34 C18 29 14 25 14 21 C14 18 16.5 16 19 16 C21 16 23 17.5 24 19 C25 17.5 27 16 29 16 C31.5 16 34 18 34 21 C34 25 30 29 24 34 Z"
        fill="#3fa9ff" filter="url(#ally_glow_ui)" opacity="0.9"/>
  <!-- crisp heart core -->
  <path d="M24 33 C18.5 28.5 15 24.8 15 21.3 C15 18.7 17 17 19.2 17 C21 17 22.8 18.2 24 19.8 C25.2 18.2 27 17 28.8 17 C31 17 33 18.7 33 21.3 C33 24.8 29.5 28.5 24 33 Z"
        fill="#3fa9ff" stroke="#101218" stroke-width="2" stroke-linejoin="round"/>
  <!-- heart rim-light glint -->
  <path d="M19 18.5 C20.4 18.5 21.8 19.5 22.7 20.7" fill="none"
        stroke="#bcd6f2" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- corner rivets for a forged steampunk read -->
  <g fill="#bcd6f2" opacity="0.85">
    <circle cx="12.5" cy="13" r="1.4"/>
    <circle cx="35.5" cy="13" r="1.4"/>
  </g>
</svg>
