<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Standing Tank Defense - UI COIN "Warm Brass" -->
  <!-- Gaslamp Bulwark style. Gold coin status icon, crisp at 24px. Centered. -->
  <defs>
    <filter id="coin_glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- ground shadow under the coin -->
  <ellipse cx="24" cy="42" rx="13" ry="3.2" fill="#0b0d14" opacity="0.4"/>

  <!-- steel-dark rim ring (outer edge of the coin) -->
  <circle cx="24" cy="24" r="18" fill="#3a4a63" stroke="#101218" stroke-width="3"/>

  <!-- brass face -->
  <circle cx="24" cy="24" r="14" fill="#caa24a" stroke="#101218" stroke-width="2.5"/>

  <!-- inner shadow on the lower/away side of the face -->
  <path d="M10 24 A14 14 0 0 0 38 24 A14 14 0 0 1 10 24 Z" fill="#3a4a63" opacity="0.0"/>
  <path d="M10.5 26 A14 14 0 0 0 37.5 26 L37.5 24 A14 14 0 0 1 10.5 24 Z"
        fill="#0b0d14" opacity="0.28"/>

  <!-- embossed inner disc -->
  <circle cx="24" cy="24" r="9" fill="none" stroke="#101218" stroke-width="2" opacity="0.55"/>

  <!-- struck emblem: a brass bulwark "coin" star -->
  <path d="M24 16 l2.6 5.4 5.9 0.7 -4.4 4 1.2 5.8 -5.3 -2.9 -5.3 2.9 1.2 -5.8 -4.4 -4 5.9 -0.7 Z"
        fill="#bcd6f2" opacity="0.18" stroke="#101218" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- top rim light (steel-light glint along the upper edge) -->
  <path d="M14 18 A14 14 0 0 1 34 18" fill="none" stroke="#bcd6f2"
        stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>

  <!-- crisp specular glint -->
  <circle cx="18.5" cy="18.5" r="2.6" fill="#bcd6f2" filter="url(#coin_glow)"/>
  <circle cx="18.5" cy="18.5" r="1.5" fill="#e8e3d2"/>
</svg>
