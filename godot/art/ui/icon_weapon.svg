<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Brass cannon, pointing UP (north), high 3/4 read -->
  <!-- ground shadow -->
  <ellipse cx="32" cy="54" rx="20" ry="5" fill="#0b0d14" fill-opacity="0.35"/>

  <!-- wheeled carriage base -->
  <g stroke="#101218" stroke-width="3.5" stroke-linejoin="round">
    <rect x="16" y="44" width="32" height="9" rx="4" fill="#3a4a63"/>
    <circle cx="20" cy="49" r="6" fill="#6f8db3"/>
    <circle cx="44" cy="49" r="6" fill="#6f8db3"/>
  </g>
  <circle cx="20" cy="49" r="2" fill="#3a4a63" stroke="#101218" stroke-width="1.5"/>
  <circle cx="44" cy="49" r="2" fill="#3a4a63" stroke="#101218" stroke-width="1.5"/>

  <!-- cannon barrel (vertical, brass) -->
  <g stroke="#101218" stroke-width="4" stroke-linejoin="round">
    <rect x="24" y="12" width="16" height="34" rx="6" fill="#caa24a"/>
  </g>
  <!-- inner shadow on barrel -->
  <path d="M34 14 q4 18 0 30 l4 0 l0 -30 z" fill="#101218" fill-opacity="0.22"/>
  <!-- rim light -->
  <path d="M27 16 q-1 14 0 27" fill="none" stroke="#bcd6f2" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- muzzle ring -->
  <rect x="22" y="10" width="20" height="8" rx="4" fill="#6f8db3" stroke="#101218" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- muzzle bore -->
  <ellipse cx="32" cy="14" rx="5" ry="3" fill="#171a24" stroke="#101218" stroke-width="2"/>

  <!-- breech band -->
  <rect x="22" y="38" width="20" height="6" rx="3" fill="#3a4a63" stroke="#101218" stroke-width="3" stroke-linejoin="round"/>
</svg>
