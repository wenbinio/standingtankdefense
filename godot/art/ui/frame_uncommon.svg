<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- slot fill -->
  <rect x="8" y="8" width="80" height="80" rx="14" fill="#171a24"/>
  <!-- inner glow ring (soft, rarity color) -->
  <rect x="13" y="13" width="70" height="70" rx="11" fill="none" stroke="#4fc36a" stroke-width="6" stroke-opacity="0.25" filter="url(#glow)"/>
  <!-- rarity border -->
  <rect x="11" y="11" width="74" height="74" rx="12" fill="none" stroke="#4fc36a" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- outer ink outline -->
  <rect x="8" y="8" width="80" height="80" rx="14" fill="none" stroke="#101218" stroke-width="3" stroke-linejoin="round"/>
  <!-- top rim light -->
  <path d="M20 14 h56" fill="none" stroke="#bcd6f2" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35"/>
  <!-- rarity notch/gem at top-center -->
  <path d="M48 4 l8 8 l-8 8 l-8 -8 z" fill="#4fc36a" stroke="#101218" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M48 7 l4.5 4.5 l-4.5 4.5 z" fill="#101218" fill-opacity="0.25"/>
</svg>
